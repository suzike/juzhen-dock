.slide-n{font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--cb-ink);background:var(--cb-soft);border-radius:5px;padding:2px 7px;font-variant-numeric:tabular-nums}
.slide-t{font-size:var(--fs-lead);font-weight:var(--fw-bold)}
.slide ul{margin:0;padding-left:18px}
.slide li{font-size:var(--fs-body);color:var(--ink-2);line-height:1.75;margin-bottom:var(--sp-1)}
.slide li::marker{color:var(--cb)}
.md{font-size:var(--fs-body);line-height:1.85;color:var(--ink-2)}
.md h1{font-size:19px;font-weight:var(--fw-bold);color:var(--ink-1);margin:0 0 var(--sp-3)}
.md h2{font-size:var(--fs-sub);font-weight:var(--fw-bold);color:var(--ink-1);margin:18px 0 9px}
.md h2::before{content:'';display:inline-block;width:4px;height:13px;border-radius:2px;background:var(--cb);margin-right:var(--sp-2);vertical-align:-1.5px}
.md h2:first-child{margin-top:0}
.md p{margin:0 0 11px}
.md ul{margin:0 0 11px;padding-left:19px}
.md li{margin-bottom:var(--sp-1)}
.md code{font-family:var(--mono);font-size:var(--fs-meta);background:var(--cb-soft);border-radius:5px;padding:2px 5px;color:var(--cb-ink)}
.md pre{background:var(--paper-3);border-radius:var(--r-l);padding:11px;overflow:auto;margin:0 0 var(--sp-3)}
.md pre code{background:none;padding:0;color:var(--ink-2);line-height:1.75;display:block;white-space:pre}
.md strong{color:var(--ink-1);font-weight:var(--fw-bold)}
.md blockquote{margin:0 0 var(--sp-3);padding:3px 0 3px var(--sp-3);border-left:3px solid var(--cb);color:var(--ink-3)}
.txt{font-family:var(--mono);font-size:var(--fs-meta);line-height:1.8;color:var(--ink-2);background:var(--paper-3);
  border-radius:var(--r-l);padding:var(--sp-3);white-space:pre-wrap;word-break:break-word}
.img-wrap{border-radius:var(--r-l);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);padding:10px}
.img-wrap svg{display:block;width:100%}
.web-card{padding:15px;border-radius:var(--r-l);background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line)}
.web-card h3{font-size:var(--fs-sub);font-weight:var(--fw-bold);line-height:1.5;margin-bottom:9px}
.web-card p{font-size:var(--fs-body);color:var(--ink-2);line-height:1.8}
.web-url{margin-top:10px;font-size:var(--fs-meta);color:var(--ink-3);word-break:break-all;font-family:var(--mono)}

/* ==================== Toast / 右键菜单 ==================== */
.toast{position:fixed;left:22px;bottom:22px;z-index:var(--z-toast);display:flex;align-items:center;gap:10px;padding:10px 15px;border-radius:var(--r-l);
  background:rgba(43,33,25,.93);color:#FBF5EA;font-size:var(--fs-body);font-weight:var(--fw-med);
  box-shadow:0 20px 46px -18px rgba(43,33,25,.6);opacity:0;transform:translateY(16px) scale(.96);
  transition:opacity var(--dur-slow) var(--spring),transform var(--dur-slow) var(--spring);pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast .t-dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--a1)}
.ctx{position:fixed;z-index:var(--z-ctx);min-width:190px;padding:5px;border-radius:var(--r-l);background:rgba(255,255,255,.94);
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 26px 60px -22px rgba(43,33,25,.42);
  opacity:0;transform:scale(.94);transform-origin:top left;
  transition:opacity var(--dur-fast) var(--ease),transform var(--dur-fast) var(--ease);pointer-events:none}
.ctx.show{opacity:1;transform:none;pointer-events:auto}
.ctx-item{display:flex;align-items:center;gap:10px;padding:var(--sp-2) 10px;border-radius:var(--r-s);font-size:var(--fs-body);font-weight:var(--fw-med);transition:background var(--dur-fast) ease}
.ctx-item .ci{flex:none;color:var(--ink-3);display:flex;transition:color var(--dur-fast) ease}
.ctx-item:hover{background:var(--cb-soft);color:var(--cb-ink)}
.ctx-item:hover .ci{color:var(--cb)}
.ctx-item.danger:hover{background:var(--a1);color:#fff}
.ctx-item.danger:hover .ci{color:#fff}
.ctx-sep{height:1px;background:var(--line);margin:5px 9px}

/* ==================== 桌面分区（盯住模式的可视化） ==================== */
.zones{position:fixed;inset:0;z-index:var(--z-zones);pointer-events:none;opacity:0;transition:opacity var(--dur-slow) var(--ease)}
.zones.show{opacity:1}
/* 盯住模式的桌面分区预演。
   几何由 JS 按面板实测宽度推导：面板占位（.zone.host）绝对定位，其余格子
   交给 .free 里的 CSS Grid 自动均分。旧版把每个格子的 left/right 写成常数，
   面板宽度一改就静默错位；四分格还是按视口 50% 分栏，两列既不均等也没缝隙。 */
.zone{position:relative;border-radius:var(--r-xl);border:2px dashed rgba(43,33,25,.20);background:rgba(255,255,255,.26);
  transition:border-color var(--dur-slow) var(--ease),background var(--dur-slow) var(--ease)}
.free{position:absolute;display:grid;gap:var(--sp-3)}
.free[data-layout="split2"]{grid-template-columns:minmax(0,1fr)}
.free[data-layout="split3"]{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.free[data-layout="quad"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.zone.host{position:absolute;border-style:solid;border-color:var(--a1);background:var(--a1-soft)}
.zone .zl{position:absolute;left:15px;top:12px;font-size:var(--fs-meta);font-weight:var(--fw-bold);color:var(--ink-3)}
.zone.host .zl{color:var(--a1-d)}
.zone .zw{position:absolute;inset:36px 12px 12px;display:flex;gap:var(--sp-2);align-items:flex-start;flex-wrap:wrap;align-content:flex-start;overflow:hidden}
.wcard{width:118px;border-radius:var(--r-m);background:var(--card);box-shadow:0 8px 18px -10px rgba(43,33,25,.34);overflow:hidden;
  transform:translateY(10px) scale(.94);opacity:0;transition:transform var(--dur-slow) var(--spring),opacity var(--dur-slow) var(--ease)}
.zones.show .wcard{transform:none;opacity:1}
.wcard-b{height:7px;background:var(--a4)}
.wcard-t{padding:7px 9px;font-size:var(--fs-micro);font-weight:var(--fw-semi);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zone .zhint{position:absolute;left:15px;bottom:12px;right:15px;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.6}

/* ==================== 引导 ==================== */
.onboard{position:fixed;inset:0;z-index:var(--z-onboard);display:flex;align-items:center;justify-content:center;
  background:var(--veil);backdrop-filter:blur(10px);transition:opacity var(--dur-slow) var(--ease),visibility var(--dur-slow)}
.onboard.hide{opacity:0;visibility:hidden;pointer-events:none}
.onboard-card{width:420px;max-width:calc(100vw - 40px);padding:28px 26px var(--sp-6);border-radius:var(--r-2xl);text-align:center;
  background:rgba(255,255,255,.9);backdrop-filter:blur(42px) saturate(132%);border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 40px 92px -34px rgba(43,33,25,.44)}
.ob-mark{width:52px;height:52px;margin:0 auto 15px;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(146deg,var(--a1),var(--a1-d));box-shadow:0 18px 34px -14px var(--a1)}
.ob-mark::before{content:'';position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-8.5px 0 0 -8.5px;border-radius:5px;background:#fff;transform:rotate(45deg)}
.ob-mark::after{content:'';position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:var(--a1)}
.ob-t{font-size:20px;font-weight:var(--fw-bold);letter-spacing:.2em;margin-bottom:var(--sp-2)}
.ob-s{font-size:var(--fs-body);color:var(--ink-2);line-height:1.8}
.demo{position:relative;height:96px;margin:17px 0;border-radius:var(--r-l);overflow:hidden;background:var(--paper-3);box-shadow:inset 0 0 0 1.5px var(--line)}
.demo-edge{position:absolute;right:0;top:14px;bottom:14px;width:3.5px;border-radius:4px 0 0 4px;
  background:linear-gradient(180deg,var(--a1),var(--a3));animation:demoPulse 1.9s ease-in-out infinite}
@keyframes demoPulse{0%,100%{opacity:.3;transform:scaleY(.62)}50%{opacity:1;transform:scaleY(1)}}
.demo-panel{position:absolute;right:0;top:14px;bottom:14px;width:96px;border-radius:var(--r-m) 0 0 var(--r-m);background:var(--card);
  box-shadow:-10px 0 26px -14px rgba(43,33,25,.32);animation:demoSlide 3s var(--ease) infinite;padding:9px}
.demo-panel i{position:absolute;display:block;border-radius:5px}
.demo-panel i:nth-child(1){left:11px;right:31px;top:12px;height:7px;background:var(--a3)}
.demo-panel i:nth-child(2){left:11px;right:12px;top:28px;height:16px;background:var(--a1-soft)}
.demo-panel i:nth-child(3){left:11px;right:12px;top:49px;height:16px;background:var(--a2);opacity:.5}
@keyframes demoSlide{0%,42%{transform:translateX(100%);opacity:0}58%{transform:translateX(0);opacity:1}86%{transform:translateX(0);opacity:1}100%{transform:translateX(100%);opacity:0}}
.demo-cursor{position:absolute;right:144px;top:44px;animation:demoMove 3s var(--ease) infinite}
@keyframes demoMove{0%,46%{transform:translateX(0);opacity:0}54%{opacity:1}64%{transform:translateX(120px);opacity:1}86%{transform:translateX(120px);opacity:1}100%{transform:translateX(120px);opacity:0}}
.ob-keys{display:flex;gap:7px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.ob-key{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:var(--r-s);background:var(--paper-3);
  font-size:var(--fs-meta);font-weight:var(--fw-med);color:var(--ink-2)}
.ob-key b{font-weight:var(--fw-bold);color:var(--ink-1);background:var(--card);border-radius:5px;padding:2px 6px;font-size:var(--fs-meta);
  box-shadow:0 1px 3px rgba(43,33,25,.14)}
.btn-primary{width:100%;padding:11px;border-radius:var(--r-m);background:var(--a1);color:#fff;font-size:var(--fs-lead);font-weight:var(--fw-semi);
  letter-spacing:.14em;box-shadow:0 16px 32px -14px var(--a1),inset 0 1px 0 rgba(255,255,255,.24);transition:all var(--dur-med) var(--spring)}
.btn-primary:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-primary:active{transform:translateY(0) scale(.99)}

body[data-motion="light"]{--dp:280ms;--di:300ms}
/* R3 补缺口：--dur-* 令牌上线后，"减少动效"必须连它们一起关掉 ——
   否则设置页写着"动效：关"，117 处过渡照常播放，开关就成了假的。 */
body[data-motion="light"]{--dur-slow:320ms}
body[data-motion="off"]{--dp:1ms;--di:1ms;--dur-fast:1ms;--dur-med:1ms;--dur-slow:1ms}
body[data-motion="off"] .page [data-stagger]{animation:none}
body[data-motion="off"] .demo-panel,body[data-motion="off"] .demo-cursor,body[data-motion="off"] .demo-edge,
body[data-motion="off"] .pin-bar .pd{animation:none}
body[data-motion="off"] .track{transition:none}
body[data-motion="off"] .qa-a.run:empty,body[data-motion="off"] .skel{animation:none}
/* 操作系统的"减少动态效果"偏好等价于把动效强度设为关闭 */
@media (prefers-reduced-motion:reduce){
  :root{--dp:1ms;--di:1ms;--beam:1ms;--dur-fast:1ms;--dur-med:1ms;--dur-slow:1ms}
  .page [data-stagger],.pin-bar .pd,.demo-edge,.demo-panel,.demo-cursor{animation:none}
  .track{transition:none}
  /* 骨架屏关掉位移、留一块静态底色 —— 加载中的信息还在，晃动没有 */
  .qa-a.run:empty,.skel{animation:none}
  /* 按压反馈本质是位移，同样关停 */
  button:not(:disabled):active{transform:none}
}

/* ---------- 按压反馈系统（R3） ----------
   之前全站只有 5 处零散的 :active 缩放，大多数按钮按下去毫无反应 ——
   鼠标按下的一瞬没有反馈，用户会怀疑"点上了吗"。这里给所有可按的
   <button> 一条底线：按住即轻微收缩。
   :where() 把选择器的特异性降到零 —— 下面这条只是一条**默认值**，
   .hbtn:active / .ph-act:active / .btn-primary:active 这些带类的
   定制深压（.92/.93/.99）特异性更高，照旧各自生效。
   transform:scale 走合成层，不触发重排；按下时它会自然压过 :hover
   的抬升位移，形成"按下去"的实体感 —— 这正是 Material 的按压语义。
   （初版写成 button:not(:disabled):active，特异性 (0,2,1) 反过来
   压住了所有定制深压 —— 审查抓出来的。教训：全局兜底规则必须
   用 :where() 降权，否则它是覆盖而不是兜底。） */
:where(button:not(:disabled)):active{transform:scale(.965)}

/* ============================================================
   真实桌面模式（Electron）
   ------------------------------------------------------------
   这一节只在 window.JZ 存在时生效（init 里给 <html>/<body> 挂
   .real-desktop）。同一个 prototype.html 因此两用：
   浏览器打开 = 高保真原型；Electron 打开 = 真实桌面工具。

   要撤掉的东西：原型为了"能看"，在页面里画了一个假桌面（奶油底 +
   假桌面图标 + 假任务栏）和一层压暗遮罩。真跑在 Windows 上时这些
   会盖住用户真正的桌面 —— 窗口是透明的，面板应该浮在真桌面之上。
   ============================================================ */
html.real-desktop,body.real-desktop{background:transparent}
body.real-desktop .desktop,
body.real-desktop .desk-icons,
body.real-desktop .dock,
body.real-desktop .scrim,
body.real-desktop .zones,
body.real-desktop .hotzone{display:none}

/* 窗口比面板宽 100px：面板宽 580 靠右 12，左边那 88px 是留给面板
   外投影的透明通道。原型的 max-width 是按整屏算的，这里解开。 */
body.real-desktop .panel{max-width:none}

/* 吐司挂在面板右下角。原型定位在 left:22px，那是按整屏算的，
   在只有 680px 宽的窗口里会跑到面板左边的透明区去，像飘在桌面上。 */
body.real-desktop .toast{left:auto;right:26px;bottom:26px;max-width:min(520px,calc(100vw - 120px))}

/* 全屏浮层必须收进面板矩形。
   窗口宽 680 = 面板 580 + 右留边 12 + 左侧 88 的阴影通道。.onboard / .minip
   原本是 inset:0，在桌面版会连那条透明通道一起糊住 —— 表现为窗口左侧横着
   一条米白色挡在真实桌面上。这几个数字与 main.js 的 PANEL_W / PANEL_PAD /
   WIN_W 一一对应，改窗口几何时两边要一起改。 */
body.real-desktop .onboard,
body.real-desktop .minip{top:12px;right:12px;bottom:12px;left:88px}

/* 引导卡的宽度是按整屏配的 420px，在 580 的面板里要收一点 */
body.real-desktop .onboard-card{width:min(392px,calc(100% - 44px))}

/* 右键菜单和主题弹层同样受窄视口约束，别让它们顶出窗口右缘 */
body.real-desktop .ctx{max-width:calc(100vw - 108px)}

/* 桌面版的面板不参与"整屏演示"，去掉那圈示意用的外发光 */
body.real-desktop .panel.pinned{box-shadow:var(--sh-panel)}

/* Electron 里没有浏览器地址栏，深链参数改由主进程 loadFile 的 hash 传入，
   这一条是给"面板已盯住时窗口失焦不收起"的主进程逻辑做视觉对齐 */
body.real-desktop .pin-bar em{opacity:.9}

/* ==================== 面板内的文本输入浮层 ==================== */
/* 替代 window.prompt。Electron 不支持 prompt，而"片段变量填充"必须要
   一个能收文本的地方。做成面板内浮层而不是系统对话框，是因为它能跟着
   主题走，而且不会把整个窗口卡住。 */
.minip{position:fixed;inset:0;z-index:var(--z-modal);display:flex;align-items:center;justify-content:center;
  background:rgba(43,33,25,.18);opacity:0;transition:opacity var(--dur-fast) var(--ease);pointer-events:none}
.minip.show{opacity:1;pointer-events:auto}
/* 正在退场的浮层：还在 DOM 里（要放完淡出），但已经不算"当前浮层"了 */
.minip.closing{pointer-events:none}
.mp-card{width:min(392px,calc(100% - 56px));padding:18px 18px var(--sp-4);border-radius:var(--r-xl);
  background:var(--pop);border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 30px 70px -26px rgba(43,33,25,.46);
  transform:translateY(12px) scale(.97);transition:transform var(--dur-med) var(--spring)}
.minip.show .mp-card{transform:none}
.mp-t{font-size:var(--fs-lead);font-weight:var(--fw-semi);color:var(--ink-1);margin-bottom:11px;line-height:var(--lh-tight)}
/* 表单顶部的说明行（目前只在"从分组头 + 进来"时出现，用来交代归类规则）。
   没有提示时这一行会被整个移除，不会留一条空灰条。 */
.mp-hint{font-size:var(--fs-meta);line-height:1.55;color:var(--ink-2);background:var(--paper-3);
  border-radius:var(--r-m);padding:9px 11px;margin:-4px 0 11px;white-space:pre-wrap}
.mp-in{width:100%;padding:10px var(--sp-3);border-radius:var(--r-m);border:1.5px solid var(--line-2);
  font-size:var(--fs-body);font-family:inherit;color:var(--ink-1);background:var(--card);outline:none;
  transition:border-color var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.mp-in:focus{border-color:var(--a1);box-shadow:0 0 0 3px var(--a1-soft)}
.mp-in::placeholder{color:var(--ink-4)}
.mp-r{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
.mp-b{padding:var(--sp-2) 17px;border-radius:var(--r-m);font-size:var(--fs-body);font-weight:var(--fw-semi);
  font-family:inherit;color:var(--ink-2);background:var(--paper-3);transition:all var(--dur-med) var(--ease)}
.mp-b:hover{filter:brightness(.97)}
.mp-b.pri{color:#fff;background:var(--a1);box-shadow:0 12px 24px -12px var(--a1)}
/* 危险动作（删东西、跑命令）用胭脂，跟"确定"分开 ——
   两个都是主按钮的时候，手滑的代价不一样大。 */
.mp-b.pri.dg{background:#B23A48;box-shadow:0 12px 24px -12px rgba(178,58,72,.62)}

/* ---- 多字段编辑：一个字段也好四个字段也好，都是这一套 ---- */
.mp-card.wide{width:min(436px,calc(100% - 44px))}
.mp-fs{display:flex;flex-direction:column;gap:10px;max-height:54vh;overflow-y:auto;
  margin:-2px -4px;padding:2px var(--sp-1)}
.mp-f{display:flex;flex-direction:column;gap:5px}
.mp-fl{font-size:var(--fs-meta);font-weight:var(--fw-semi);color:var(--ink-3)}
.mp-f textarea.mp-in{resize:vertical;min-height:66px;line-height:1.58;font-size:var(--fs-meta)}
/* 只有代码类的正文用等宽。速记和待办是中文句子，等宽字体会让人以为在填表。
   路径也归到"该等宽"这一类：反斜杠和盘符在等宽下才对得齐。 */
.mp-f.mono textarea.mp-in,
.mp-f.mono input.mp-in{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* 带系统选择框的字段：输入框占满左侧，右边一个「选择…」。
   按钮只在桌面版出现（浏览器里没有 JZ 桥），所以这组样式在原型里
   只会被 .mp-pk 用到一半 —— 留着自己拉通高度，别依赖按钮撑。 */
.mp-pk{display:flex;gap:7px;align-items:stretch}
.mp-pk .mp-in{flex:1;min-width:0}
.mp-browse{flex:none;display:inline-flex;align-items:center;gap:5px;padding:0 var(--sp-3);
  border-radius:var(--r-m);font-size:var(--fs-meta);font-weight:var(--fw-semi);font-family:inherit;
  color:var(--ink-2);background:var(--paper-3);box-shadow:inset 0 0 0 1.5px var(--line);
  transition:all var(--dur-med) var(--ease);white-space:nowrap}
.mp-browse:hover{color:var(--ink-1);background:var(--card)}
.mp-msg{font-size:var(--fs-body);line-height:1.62;color:var(--ink-2);white-space:pre-wrap;
  word-break:break-word;max-height:38vh;overflow-y:auto;
  padding:10px var(--sp-3);border-radius:var(--r-m);background:var(--paper-3)}
.mp-list{display:flex;flex-direction:column;gap:6px}
.mp-opt{display:flex;align-items:center;gap:9px;width:100%;padding:10px var(--sp-3);border-radius:var(--r-m);
  font-size:var(--fs-body);font-weight:var(--fw-semi);font-family:inherit;color:var(--ink-2);
  background:var(--paper-3);text-align:left;transition:all var(--dur-med) var(--ease)}
.mp-opt:hover{background:var(--paper-2);color:var(--ink-1)}
.mp-opt:focus{outline:none;box-shadow:0 0 0 3px var(--a1-soft)}
.mp-oi{display:flex;flex:none;color:var(--a1)}
/* 可选的一行小字。命令用等宽 —— 它是要被执行的东西，拼错一个字符后果不同。 */
.mp-ot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;flex:1}
.mp-otl{min-width:0}
.mp-od{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:var(--fs-micro);font-weight:var(--fw-norm);color:var(--ink-4);
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace}

/* ---- 卡片右上角的「⋯」 ----
   右键菜单一直都在，但没有人会去猜它存在。给每一张能改的卡片挂一个
   看得见的入口，点它跟右键是同一条路。 */
/* 「⋯」是卡片上唯一可见的编辑/删除入口。原来用 --ink-4（最淡的装饰色阶），
   在整页观感里几乎融进纸面 —— 用户可以接受"点开才知道"，但不能接受
   "根本看不到有东西可点"。功能性控件用次级的 --ink-3，装饰性留白才用 --ink-4。 */
.ctx-more{flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;color:var(--ink-3);background:transparent;
  font-family:inherit;transition:color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease)}
.ctx-more:hover{color:var(--ink-1);background:rgba(31,29,26,.07)}

/* ============================================================
   终端（ConPTY）
   ------------------------------------------------------------
   三条自我约束：
     1. 只用"纸面 + 墨色阶 + 一个主色"。终端天然容易变成"黑底绿字"的
        独立世界，而那和聚珍收敛之后的调子冲突 —— 所以背景走 --paper-3，
        字走 --ink-1，主色只出现在光标、选中标签的底色与那根提示符标记上。
     2. 可点的东西不许藏在 hover 里（和全站同一条规则）。
     3. 终端区必须有**明确高度**：xterm 按父容器量尺寸，父容器高度不确定时
        fit() 会算出一行两列，表现成"终端里只有一个字符宽"。
   ============================================================ */
.tz-panel{display:flex;gap:10px;align-items:flex-start;padding:var(--sp-3) 14px;margin-bottom:10px;
  border-radius:var(--r-m);background:var(--surf);border:1px solid var(--line);
  box-shadow:var(--sh-card);color:var(--ink-3);font-size:var(--fs-meta);line-height:1.65}
.tz-panel svg{flex:none;margin-top:2px;color:var(--a1)}
.tz-panel b{display:block;color:var(--ink-1);font-size:var(--fs-body);margin-bottom:2px}
/* 「起不来」这一档不能只靠文字说 —— 给一道主色竖条，让人扫一眼就知道
   这一块现在不是正常状态，同时不引入第二个色相。 */
.tz-panel.bad{border-left:3px solid var(--a1);padding-left:var(--sp-3)}

/* ---- 标签栏 ---- */
.tz-bar{display:flex;align-items:center;gap:6px;margin-bottom:var(--sp-2);min-height:26px}
.tz-tabs{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none}
.tz-tabs::-webkit-scrollbar{height:0}
.tz-empty{color:var(--ink-3);font-size:var(--fs-micro)}
.tz-tab{display:inline-flex;flex:none;align-items:center;gap:5px;height:26px;padding:0 6px 0 9px;
  border-radius:var(--r-s);background:var(--surf);border:1px solid var(--line);
  color:var(--ink-3);font-size:var(--fs-micro);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.tz-tab b{font-weight:var(--fw-semi);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tz-tab:hover{color:var(--ink-1);border-color:var(--line-2)}
.tz-tab.on{background:var(--cb-soft);border-color:var(--cb-brd);color:var(--cb-ink)}
.tz-tab.dead{opacity:.62}
.tz-tab.dead b{text-decoration:line-through}
.tz-x{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;color:var(--ink-3);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tz-x:hover{background:rgba(31,29,26,.10);color:var(--ink-1)}
/* 标签上的 ⋯：和站里其它卡片同一条规矩 —— 有右键菜单的地方都要有看得见的入口。
   只有右键时，"重命名 / 换 Shell"这些能力等于不存在（用户不会去猜）。 */
.tz-more{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;color:var(--ink-3);transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tz-more:hover{background:rgba(31,29,26,.10);color:var(--ink-1)}
.tz-add,.tz-all{flex:none;display:inline-flex;align-items:center;gap:var(--sp-1);height:26px;padding:0 9px;
  border-radius:var(--r-s);background:var(--surf);border:1px solid var(--line);
  color:var(--ink-2);font-size:var(--fs-micro);font-family:inherit;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tz-add:hover{background:var(--cb-soft);border-color:var(--cb-brd);color:var(--cb-ink)}
.tz-all{color:var(--ink-3)}
.tz-all:hover{color:var(--ink-1);background:rgba(31,29,26,.06)}

/* ---- 终端本体 ----
   高度原来是 clamp(240px,44vh,540px) —— 写死封顶。加上上方那面 16 键的预设墙、
   下方的动作行/状态条/四行说明，"最该大的那块"反而是整页最矮的一块。
   现在它拿满剩余高度：父容器 .page-body 由 renderPage 挂上 flexterm 类
   （变成 flex 列），这里的 flex:1 才真正生效。
   min-height 不能省：面板被压得很扁时，终端要有个下限，否则一行都看不见。 */
.tz-main{position:relative;flex:1;min-height:140px;margin-bottom:0}
.tz-host{position:absolute;inset:0;border-radius:var(--r-m);overflow:hidden;
  border:1px solid var(--line-2);background:var(--paper-3);box-shadow:var(--sh-card)}
.tz-box{position:absolute;inset:0}
.tz-pane{position:absolute;inset:0;display:none;padding:7px var(--sp-1) 5px 9px}
.tz-pane.on{display:block}
/* xterm 本体要撑满它的宿主，否则会有"下面留一条空白"或"多出一行滚动条" */
.tz-pane .xterm{height:100%}
.tz-pane .xterm-viewport{background:transparent!important;scrollbar-width:thin}
.tz-pane .xterm-viewport::-webkit-scrollbar{width:8px}
.tz-pane .xterm-viewport::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.tz-pane .xterm-viewport::-webkit-scrollbar-track{background:transparent}
/* 兜底容器：摘出来的终端 DOM 暂存在这里，必须不可见也不占位。
   用 hidden 属性而不是 display:none 类：它是纯 DOM 事实，不参与主题。 */
#termStash{display:none}

/* 动作行 / 状态条 / 底部说明的样式原来住在这里（.tz-acts / .tz-foot / .tz-note）。
   "主功能被挤压"的直接来源就是它们加上面那面预设墙。
   功能没删，全部收进标签栏的「更多」浮层；样式一并删除 ——
   留着不会有人看见，但下一个读代码的人会以为这些元素还在。
   非零退出码那条配色规则（.tz-bad）也没用了：退出码本身还在 p.exit 里，
   只是不再有位子常驻显示它。 */

/* 状态说明块的文字部分（可用 / 不可用 / 正在探测，三档共用一套排版） */
.tz-why{display:flex;flex-direction:column;gap:2px;min-width:0}
.tz-why b{color:var(--ink-1);font-size:var(--fs-body)}
.tz-why span{color:var(--ink-3);font-size:var(--fs-meta);line-height:1.7}

/* ---- 速问：会话条 / 会话行 / 引用 / 知识库（2026-09-22 搬 agentic-island 的问答形态）---- */
.asess{padding:11px var(--sp-3);border-radius:var(--r-l);background:var(--card);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:11px}
.asess-h{display:flex;align-items:center;gap:var(--sp-2)}
.asess-t{flex:1;min-width:0;font-size:var(--fs-body);font-weight:var(--fw-bold);color:var(--ink-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asess-n{flex:none;font-size:var(--fs-micro);color:var(--ink-3);font-variant-numeric:tabular-nums;
  background:var(--paper-3);padding:2px 7px;border-radius:999px}
.asess-h .ctx-more{width:20px;height:20px;border-radius:6px;color:var(--ink-3)}
.asess-h .ctx-more:hover{color:var(--ink-1);background:rgba(31,29,26,.09)}
.asess-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.asess-tg{display:inline-flex;align-items:center;gap:5px;height:27px;padding:0 10px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surf);color:var(--ink-2);
  font-size:var(--fs-micro);font-family:inherit;cursor:pointer;
  transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.asess-tg svg{flex:none;opacity:.8}
.asess-tg:hover{border-color:var(--cb-brd);color:var(--ink-1)}
.asess-tg.on{background:var(--cb);border-color:var(--cb);color:#fff;font-weight:var(--fw-semi)}
.asess-tg.on svg{opacity:1}
.asess-hint{margin-top:9px;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.75}
.asess-hint b{color:var(--ink-2)}

.sess-row{display:flex;align-items:center;gap:2px;padding:3px 6px 3px 0;border-radius:var(--r-m);background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);
  transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease)}
.sess-row:hover{transform:translateY(-2px);box-shadow:0 12px 20px -11px rgba(43,33,25,.3),inset 0 0 0 1.5px var(--cb-brd)}
.sess-row.on{box-shadow:inset 0 0 0 1.5px var(--cb),0 12px 20px -12px var(--cb-brd)}
.sess-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:6px var(--sp-1) 6px 11px;
  background:none;border:none;font-family:inherit;text-align:left;cursor:pointer}
.sess-t{font-size:var(--fs-body);font-weight:var(--fw-semi);color:var(--ink-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-s{font-size:var(--fs-micro);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-row .ctx-more{margin-right:2px}

.qa-refs{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.qa-ref{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 9px;border-radius:999px;
  background:var(--cb-soft);color:var(--cb-ink);font-size:var(--fs-micro);font-weight:var(--fw-semi)}
.qa-ref i{font-style:normal;opacity:.7}
.qa-ref span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.qa-chip{flex:none;font-size:var(--fs-micro);font-weight:var(--fw-bold);color:var(--ink-3);background:var(--paper-3);
  padding:2px 7px;border-radius:999px}

.kb-src{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-m);background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line)}
.kb-ic{flex:none;width:24px;height:24px;border-radius:7px;background:var(--cb-soft);color:var(--cb-ink);
  display:flex;align-items:center;justify-content:center}
.kb-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kb-m b{font-size:var(--fs-body);font-weight:var(--fw-semi);color:var(--ink-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-m span{font-size:var(--fs-micro);color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kb-n{flex:none;font-size:var(--fs-micro);color:var(--ink-3);font-variant-numeric:tabular-nums}
.kb-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.kb-note{display:flex;gap:9px;align-items:flex-start;padding:11px var(--sp-3);
  border-radius:var(--r-m);background:var(--surf);border:1px solid var(--line);
  color:var(--ink-3);font-size:var(--fs-micro);line-height:1.75}
.kb-note + .kb-note,.kb-src + .kb-note,.kb-acts + .kb-note{margin-top:9px}
.kb-note svg{flex:none;margin-top:2px;color:var(--a1)}
.kb-note>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kb-note b{color:var(--ink-1);font-size:var(--fs-body)}
.kb-note.bad b{color:var(--cb-ink)}

</style>
</head>

<script>
/* ================================================================
   一、配色 —— 绘本风（低刺激版）
   ----------------------------------------------------------------
   上一版色轮均值 S=64% / L=53%，27 色里有 8 色落在「S≥72% 且 L 46–74%」
   的高刺激区（全是橘黄暖色），叠加桌面 4 团 alpha .95 的彩色光斑与
   玻璃层 saturate(190%)，整体偏亮刺眼。
   本版做了三层收敛：
     1. 色轮改用累进压缩 S' = S·(1−S/250) —— 饱和的压得多（87%→57%），
        本来就克制的色几乎不动（37%→31%），均值 S 降到约 46%；
        明度只压亮不提暗：L' = L>52 ? L−(L−52)·0.6 : L
     2. 光斑改为「只降饱和、保持高明度」的柔色（S 压到 38%、L 保底 82%），
        配合 alpha 降到 .44/.36 —— 光斑是背景，不该抢前景
     3. 玻璃层 saturate 由 190% 降到 132%，不再放大透上来的颜色
   保留多彩与色相区分度，只把「刺激度」降下来。
   ================================================================ */
/* 三套主题的差异只有三样：纸面、墨色、主色。
   hues 仍留 9 个位置（历史形状，索引被别处引用），但界面只取 hues[0]；
   sub 里原来写的是"橘黄蓝绿"这种多色描述 —— 它显示在主题选择器上，
   描述一套已经不用的配色，属于当面说错话，已改。                   */
/* 一套主题 = 一套纸面 + 一套墨色 + **一个**主色。
   hues 里只需要写主色那一个值（位置 0），后 8 位由下面的色阶自动补齐 ——
   见紧跟在 tint() 后面的 HUES_PAD 注释。

   后 6 套取自公开流传的中国传统色色卡（中科院科技情报编委会《色谱》1957
   那套在网上的通行版本）。色值在多个色卡站点上互相印证过：
     靛青 #177CB0 · 胭脂 #9D2933 · 绛紫 #8C4356
     竹青 #789262 · 秋香色 #D9B611 · 墨色 #50616D
   同一色名在不同版本里会有一两档深浅的差别（例如「天青」既有 #228FBD
   也有 #76BECC，「靛青」既有 #177CB0 也有 #224B8F），这里只取能对上号的。

   ⚠ 纸面与墨阶是**按主色推导出来的**，不是传统色本身。所以 sub 只写
   「浅蓝纸」这种如实描述，不把推导出来的色冒充成某个传统色名。 */
const THEMES = [
  { id:'sunny', name:'奶油阳光', sub:'暖奶油纸 · 陶橘主色',
    paper:'#FBF5EA', paper2:'#FFFFFF', paper3:'#F7EDDC', side:'#FAF2E4',
    ink1:'#2B2119', ink2:'#5A4C3C', ink3:'#796956', ink4:'#A99A85',
    hues:['#c86b46'],
    glow:['#e4d6c3','#d0dee5','#dae6dc','#eddee5'] },

  { id:'mint',  name:'薄荷清晨', sub:'冷薄荷纸 · 松绿主色',
    paper:'#F1F9F5', paper2:'#FFFFFF', paper3:'#E2F1EA', side:'#E9F6F0',
    ink1:'#16241F', ink2:'#3D544B', ink3:'#597167', ink4:'#93AAA0',
    hues:['#27887f'],

const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16)&255, (n>>8)&255, n&255]; };
const rgba    = (h, a) => { const c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
const darken  = (h, f) => '#' + hex2rgb(h).map(v => Math.max(0, Math.round(v*f)).toString(16).padStart(2,'0')).join('');
/* 向白色混合 —— 用来从任意基色派生淡彩卡片底 */
const tint    = (h, f) => '#' + hex2rgb(h).map(v => Math.round(v + (255 - v) * f).toString(16).padStart(2,'0')).join('');

/* 把每个主题的 hues 补到 9 个位置（历史形状）。
   为什么还要补：除了 vars() 只认 ACC[0]，另有 4 处真的在按槽位取色 ——
     剪切板那张趋势图取 ACC[3]、平台解析提示取 ACC[slot]（slot 只到 3）、
     剪切板分型小标签取 ACC[0..2]、"钉住"预览的窗口卡片取 ACC[s]（s 到 7）。
   所以这 9 位不能留空。
   为什么要补成同族色阶而不是继续塞别的色相：这几处原来是"每个平台一个色、
   每种剪贴类型一个色、每个预览窗口一个色"，正是用户说"太花"时的那种
   "按条目染色"。改成主色的深浅阶之后，同一屏里不会再冒出第三种色相。
   深浅交替（而不是一路往白里调）是因为其中几档要**当字色用** ——
   一路变浅的话最后两三档在纸面上根本看不见。 */
const HUES_PAD = [.30, -.14, .44, -.28, .56, -.40, .66, -.52];
THEMES.forEach(t => {
  HUES_PAD.forEach(f => {
    if (t.hues.length < 9) t.hues.push(f > 0 ? tint(t.hues[0], f) : darken(t.hues[0], 1 + f));
  });
});

/* 一次性下发"点睛色"的全部派生令牌。
   --cb      主色（图标、强调线）
   --cb-bar  半透明主色（卡片左侧色条）
   --cb-soft 淡彩底（图标底、标签底）—— 小面积用
   --cb-tint 大面积底色（分组大卡的卡身）—— **中性纸白**，不带彩
   --cb-brd  淡描边
   --cb-ink  深色文字（彩色卡上的标题）

   ---------------------------------------------------------------
   配色收敛（2026-09-22）。用户的反馈是："这一版的配色太花了，又花里胡哨的，
   一点不简洁高雅。"

   根子在这里：原来 vars(c) 把**传进来的**颜色派生成五档彩色令牌，而调用方
   是按"每个页面一个色相 / 每个分组一个色相 / 每个平台一个色相"传值的
   （pageColor(p) = ACC[p.ci]、colorFor(name) 在九色轮里哈希轮转）。
   于是同一屏上同时出现七八种颜色 —— 侧栏 13 个图标 13 种色、一页四五个
   不同颜色的分组大卡、标签芯片五颜六色，加上背景四团彩色光斑。

   现在 vars() 一律返回**主题主色**的那一套：
     · 彩色只出现在小面积处（图标底、选中态、状态点、分组前那一小段竖线）；
     · 大面积（分组卡卡身、页头、数据格）用中性纸白，一点彩都不铺；
     · 骨架交给墨色阶 —— 要区分板块靠名字和图标，不靠色相。

   参数签名保留但不再读取：调用点有十五六处，逐个改既慢又容易漏，
   而**漏掉任何一个都会让某块地方继续花**。这里一处改掉，全部生效。 */
const vars = () => '--cb:' + ACC[0]
  + ';--cb-bar:' + rgba(ACC[0], .55)
  + ';--cb-soft:' + tint(ACC[0], .88)
  + ';--cb-tint:' + rgba('#FFFFFF', glassA(glassG(), .32))
  + ';--cb-brd:'  + rgba(ACC[0], .20)
  + ';--cb-ink:'  + darken(ACC[0], .52) + ';';
/* ↑ .62 → .52（2026-09-22）。
   --cb-ink 是**字色**：压在 --cb-soft（主色的淡彩底）或纸面上的小字
   （标签、单位、编号、面包屑）。加了"秋香"那套（主色 #d9b611 芥末黄）
   之后量了一遍 WCAG 对比度：.62 时秋香的字只有 4.40:1，差一点点到 A 级线
   4.5（其余八套在 6.5–10.3，很宽裕）。压到 .52 后秋香过 5:1，
   另外八套只会更清楚 —— 这个系数只影响字，不影响图标和色条。 */

/* 面板不透明度（设置里的那根滑杆），默认 60。
   面板上有四个半透明面：面板底 / 侧栏 / 常规面 / 实面。它们原来各自写死
   （.60 / .74 / .56 / .92），彼此差着固定的档差，才形成"同一块磨砂玻璃上
   有层次"的观感。滑杆只调一个数，所以必须把档差补回去 ——
   只改面板底不动其它，四个面会挤到同一个不透明度上，材质立刻散掉。 */
let CUR = THEMES[0], ACC = [], GLASS = 60;
/* 按档差推导某一层的 alpha，并夹在可读区间内。
   下界 .12：再透下去，桌面上的窗口会直接穿到正文上。
   上界 .94（2026-09-22 加的）：滑杆拉到 100 时**面板底不能是 1.0**。
   面板上所有层次感都来自"同一个 g 上加减固定档差"——卡片 +.38、
   抬升面 +.32、侧栏 +.14。g 一旦到 1.0，Math.min(1, …) 会把它们全部
   压成同一个 1.0，卡片和面板底一样实，"卡片浮在面板上"的材质立刻散掉
   （这正是原来那版只改面板底会散架的同一个根因，只是换到了顶端）。
   留 6% 余地：100% 时面板底 .94、卡片 1.0，仍然读得出层次。 */
const glassG = () => Math.max(.30, Math.min(.94, GLASS / 100));
const glassA = (g, d) => Math.round(Math.max(.12, Math.min(1, g + d)) * 100) / 100;

function applyTheme(id){
  CUR = THEMES.find(t => t.id === id) || THEMES[0];
  ACC = CUR.hues.slice();
  const r = document.documentElement.style, t = CUR;
  const set = (k, v) => r.setProperty(k, v);
  set('--paper', t.paper); set('--paper-2', t.paper2); set('--paper-3', t.paper3);
  /* 四个半透明面 + 模糊，全部由 GLASS 派生。
     GLASS = 60 时这几个数正好等于原来写死的 .60/.74/.56/.92（42px 模糊
     也是原来的值），所以默认观感一个字都没变。 */
  const g = glassG();
  set('--panel-bg', rgba(t.paper2, g));
  set('--side-bg',  rgba(t.side,    glassA(g,  .14)));
  set('--surf',     rgba('#FFFFFF', glassA(g, -.04)));
  set('--surf-2',   rgba('#FFFFFF', glassA(g,  .32)));
  set('--surf-solid', rgba(t.paper2, glassA(g, .40)));
  /* 卡片面（2026-09-22）。卡片原来一律写死 #fff —— 滑杆对它们**完全无效**，
     用户看到的正是"面板在透，卡片还是一块块实心板"。
     档差 .38 让它始终比面板底高一档：卡片仍然浮在面板之上，只是跟着一起透。 */
  set('--card',     rgba('#FFFFFF', glassA(g,  .38)));
  /* 弹层（配色弹层 / 表单浮层）比卡片再实一点：它压在所有内容之上，
     透太多会跟背后的正文糊在一起。取 .33，正好落在原来写死的
     .90（.tpop）与 .97（.mp-card）之间，两处的观感都只差三四个百分点。 */
  set('--pop',      rgba('#FFFFFF', glassA(g,  .33)));
  /* 纸面本身也参与。--paper-3 是"凹陷面"的底 —— 代码块、说明条、分段控件
     轨道、芯片底、状态徽标，全站 39 处。它不参与的话，面板调到很透以后，
     页面上会浮着一块块不透明的补丁，比不调还难看。一处改掉，全部生效。 */
  set('--paper-3',  rgba(t.paper3, glassA(g, .40)));
  /* 越透越要糊：透到 .30 而不加模糊，底下的壁纸会直接穿到字上；
     反过来面板越实，模糊纯属白花钱（backdrop-filter 是唤出时最贵的一步）。 */
  set('--blur-panel', Math.round(Math.max(18, Math.min(64, 42 + (60 - GLASS) * .45))) + 'px');
  set('--ink-1', t.ink1); set('--ink-2', t.ink2); set('--ink-3', t.ink3); set('--ink-4', t.ink4);
  set('--line', rgba(t.ink1, .10)); set('--line-2', rgba(t.ink1, .18)); set('--brd', rgba('#FFFFFF', .64));
  /* 辅助色不再是"另外三个色相"。
     原来 a2/a3/a4 取色轮上另外三个位置，于是页头插画（文件夹那一张的三个
     文件夹分别是 --cb / --a3 / --a2）本身就是三种颜色 —— 插画反倒成了一屏
     里最花的地方。现在 a2/a4 走中性灰、a3 走主色的浅调，插画整体呈现
     "主色 + 灰阶"，跟界面其它部分同一个调子。 */
  const H = t.hues;
  set('--a1', H[0]);
  set('--a2', tint(t.ink1, .66));
  set('--a3', tint(H[0], .48));
  set('--a4', tint(t.ink1, .78));
  set('--a1-d', darken(H[0], .66)); set('--a1-soft', tint(H[0], .84)); set('--a1-brd', rgba(H[0], .30));
  set('--veil', rgba(t.paper, .48));
  /* 光斑：降到 .44/.36 —— 原本 .95/.90 的四团彩色几乎不透明地铺满整屏，
     是"整体太亮"的最大来源。 */
  set('--g1', rgba(t.glow[0], .44)); set('--g2', rgba(t.glow[1], .44));
  set('--g3', rgba(t.glow[2], .36)); set('--g4', rgba(t.glow[3], .36));
  set('--sh-panel', '0 34px 90px -30px ' + rgba(t.ink1,.30) + ',0 4px 12px -5px ' + rgba(t.ink1,.10) + ',inset 0 1px 0 ' + rgba('#FFFFFF',.92));
  set('--sh-card', '0 2px 8px -3px ' + rgba(t.ink1,.12));
  set('--sh-lift', '0 18px 34px -16px ' + rgba(t.ink1,.30));
}

/* 夜间自动水墨（R9）：nightAuto 开着时，19:00–06:00 用「水墨」，
   其余时间用你选的主题。只换主题、不动任何偏好 —— 关掉开关，
   applyTheme(你选的主题) 立刻回来。boot 与边界定时器都走这一个口径，
   "几点算夜里"只许有这一份答案。 */
function effThemeId(){
  if (!state.settings.nightAuto) return state.settings.theme;
  const h = new Date().getHours();
  return (h >= 19 || h < 6) ? 'inkwash' : state.settings.theme;
}

/* 由分类名派生颜色 —— 在整套色轮里轮转，保证同一分类永远同色 */
function colorFor(key){
  let h = 2166136261;
  for (let i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return ACC[h % ACC.length];
}
const fileKind = n => {

  if (['xlsx','xls','csv','et','tsv'].indexOf(e) >= 0) return 'sheet';
  if (e === 'pdf') return 'pdf';
  if (['pptx','ppt','dps'].indexOf(e) >= 0) return 'slide';
  if (['zip','rar','7z','tar','gz'].indexOf(e) >= 0) return 'zip';
  if (['png','jpg','jpeg','gif','svg','webp','bmp'].indexOf(e) >= 0) return 'img';
  if (['m','slx','mdl','a2l','json','xml','mat','dbc','c','h','arxml'].indexOf(e) >= 0) return 'model';

/* 图标字符串缓存。同一个 (key, size) 组合在整页里会被生成几十次
   —— 剪切板页 8 条记录 × 7 个图标 = 56 次，收藏箱卡片也各自带图标。
   每次都要走一遍 svg() 的字符串拼接，缓存后同样的组合只拼一次。 */
const _icCache = Object.create(null);
const IC = (k, s) => {
  const key = (k || '') + '@' + (s || 18);
  const hit = _icCache[key];
  if (hit !== undefined) return hit;
  return (_icCache[key] = svg(I[k] || '', s || 18));
};

/* 转义表提到模块级：旧写法把对象字面量写在 replace 回调里，
   每匹配到一个特殊字符就新建一个对象，列表页一屏能触发上千次。 */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = s => String(s).replace(/[&<>"']/g, h => ESC_MAP[h]);

function folderGroup(p){
  const parts = String(p).split(/[\\/]+/).filter(Boolean);
  if (parts.length < 2) return '根目录';
  const parent = parts[parts.length - 2];
  if (/^(lenovo|users|admin)$/i.test(parent)) return '个人目录';
  return parent;
}
function parentOf(p){
  const parts = String(p).split(/[\\/]+/).filter(Boolean);
  if (parts.length < 2) return String(p);
  const win = String(p).indexOf('\\') >= 0;
  return (win ? '' : '/') + parts.slice(0, -1).join(win ? '\\' : '/');
}

function parseUrl(raw){
  let u; try { u = new URL(String(raw).trim()); } catch(e){ return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const host = u.hostname.toLowerCase();
  const pf = PLATFORMS.find(p => p.re.test(host)) || FALLBACK_PF;
  const seg = u.pathname.split('/').filter(Boolean);
  let kind = pf.kind, title = '';
  if (pf.id === 'github' && seg.length >= 2){
    title = seg[0] + ' / ' + seg[1];
    kind = seg[2] === 'issues' ? '议题' : (seg[2] === 'blob' || seg[2] === 'tree') ? '代码' : '仓库';
  } else if (pf.id === 'arxiv' && seg.length){ title = 'arXiv ' + seg[seg.length - 1]; }
  else if (pf.id === 'bili' && seg[0] === 'video'){ title = 'B站视频 ' + (seg[1] || ''); }
  else if (seg.length){
    let last = seg[seg.length - 1];
    /* 路径里出现非法的百分号序列时 decodeURIComponent 会抛 URIError，
       宁可退回原文，也不要让整条收藏流程中断。 */
    try { last = decodeURIComponent(last); } catch(e){}
    title = last.replace(/[-_]+/g, ' ').slice(0, 64);
  }
  if (!title) title = host;
  const hay = (u.pathname + ' ' + u.search).toLowerCase();
  const tags = [];
  TAG_RULES.forEach(r => { if (r.re.test(hay)) r.tags.forEach(t => { if (tags.indexOf(t) < 0) tags.push(t); }); });
  if (!tags.length) tags.push(pf.name);
  return { url:u.href, pid:pf.id, name:pf.name, ab:pf.ab, slot:pf.slot, kind, title, desc:'', tags, time:'刚刚' };
}

  if (/^[A-Za-z]:\\/.test(s) || /^\\\\/.test(s) || /^[A-Za-z]:\//.test(s)) return 'path';
  if (/(function\s|const\s|let\s|var\s|def\s|import\s|from\s|class\s|=>|<\/?[a-zA-Z]+[^>]*>|^\s*[\[{])/m.test(s)) return 'code';

function codeLang(s){

const HEAD_ACT = {

  folders:'folders-add',   /* 与列表底部「新增文件夹」同一条路（editRecord） */
  links:'links-add',       /* 同上 */

  snip:'snip-new',
  note:'note-add',         /* 这一页的"新增"就是页顶那个输入框，head + 只是聚焦它 */
  shot:'shot-add',

                              "常用问法"，而 FORMS.ask（问答）整条链路没有新增
                              入口。用户要的是"每个功能都有可操作的入口"，

};

/* 分组头那个「+」用哪个动作。
   和 HEAD_ACT 同样集中登记，理由也一样：写在这里的字符串构建期守卫
   扫得到，现场拼的扫不到。key 是 gcard 的 addKind（也就是 data-kind），
   守卫会核对"动作有处理分支" + "kind 是页面里真实出现过的"。 */
const GROUP_ADD = {
  folder:'folder-new',     /* 预填这一组的父目录，加完告诉你落进了哪一组 */
  link:'link-new',         /* 提示这一组收什么样的域名 */

};
/* 页头：左侧标题 + 右侧绘本插画 */
function pageHead(p, extra, noAct){
  const act = HEAD_ACT[p.id];
  /* 右侧工具栏只剩两样：一个可选的「说明」ⓘ、一个可选的「新增」+。

     搜索都在列表里或输入框里自带入口，页头再放一个 + 只会重复）；
     没登记还硬渲染一个按钮，就是点着没反应的假入口。同理，没有说明就不摆 ⓘ。 */
  const infoBtn = PAGE_INFO[p.id]
    ? '<button class="ph-act quiet" data-act="ph-info" data-id="' + esc(p.id) + '" title="说明">' + IC('info', 15) + '</button>'
    : '';
  const addBtn = (noAct || !act) ? ''
    : '<button class="ph-act" data-act="' + act + '" title="新增">' + IC('plus', 15) + '</button>';
  /* 眉标只对"有分组归属"的页渲染；页码只对 PAGES 里的真页算
     （搜索页是合成对象，不在数组里 —— R4 审查抓到的 undefined · 00）。 */
  const pgIdx = PAGES.indexOf(p);
  const kicker = p.group
    ? '<div class="phero-k">' + esc(p.group)
      + (pgIdx >= 0 ? ' · ' + String(pgIdx + 1).padStart(2, '0') : '') + '</div>'
    : '';
  return '<div class="phero" style="' + vars(pageColor(p)) + '">'
       + '<div class="phero-tx">'
       + kicker
       + '<div class="phero-t">' + esc(p.title) + '</div>'
       + '<div class="phero-s">' + esc(extra || p.sub) + '</div></div>'
       + (infoBtn || addBtn ? '<div class="phero-tools">' + infoBtn + addBtn + '</div>' : '')
       + '<div class="phero-art">' + (ILLUS[p.id] || '') + '</div></div>';
}

/* 分组 = 一块彩色大卡，分组内的条目都装在这张卡里。
   颜色由分组名派生，所以同一个分组永远是同一个颜色。
   opt.grid 用来换卡内的网格：
     · 不传  → 两列小条目网格（适合"图标 + 名称 + 副标题"的短条目）
     · 'wide' → 自适应宽格，窄面板下自动落到单列（适合收藏箱这种
                含标题/描述/标签三四层信息的内容型卡片）            */
function gcard(name, n, body, opt){
  const o = opt || {};
  const c = o.color || colorFor(name);
  const cls = 'gcard-b' + (o.one ? ' one' : '') + (o.grid ? ' ' + o.grid : '');
  /* 分组头右侧那个「+」：往**当前这一个分组里**加一条。
     起因是"分组"只做了归类，没有做归入 —— 文件夹按父目录自动分成了
     Thermal / Calibration / Docs 几组，但整页只有一个"新增文件夹"，
     想把一条加进指定分组全靠运气。现在每一组自带入口。
     动作名仍然登记在 GROUP_ADD 表里（不是现场拼的）—— 现场拼出来的
     data-act 静态 HTML 里扫不到，构建期守卫就会漏掉这一整条链路，
     页头「+」已经在这上面栽过一次。
     o.addCtx 里的键会原样变成 data-* 传到按钮上（如 data-group），
     点击时再用 dataset 读回来，这样"加进哪一组"的上下文不会丢。 */
  let add = '';
  if (o.addKind){
    const act = GROUP_ADD[o.addKind];
    if (act){
      const cx = o.addCtx || {};
      const attrs = Object.keys(cx).map(k => ' data-' + k + '="' + esc(String(cx[k])) + '"').join('');
      add = '<button class="gcard-add" data-act="' + act + '"' + attrs
          + ' title="加进「' + esc(name) + '」">' + IC('plus', 13) + '</button>';
    }
  }
  return '<section class="gcard" style="' + vars(c) + '">'
       + '<div class="gcard-h"><span class="gcard-ico">' + IC(o.icon || 'folder', 18) + '</span>'
       + '<span class="gcard-nm">' + esc(name) + '</span>'
       + (o.hideN ? '' : '<span class="gcard-n">' + n + ' 项</span>')
       + add
       + '</div><div class="' + cls + '">' + body + '</div></section>';
}
function groupBy(items, keyFn){
  const m = new Map();
  items.forEach(it => { const k = keyFn(it); if (!m.has(k)) m.set(k, []); m.get(k).push(it); });
  return Array.from(m.entries()).map(e => ({ name:e[0], items:e[1] }));
}

/* ---------- 页 1 · 文件夹 ---------- */
function buildFolders(){
  const p = PAGE_MAP.folders;
  const list = pick(DATA.folders, ['name','path']);
  const groups = groupBy(list, f => folderGroup(f.path))
    .sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'zh'));
  let k = 0;
  let html = pageHead(p, list.length
    ? list.length + ' 个入口 · 按父目录自动归为 ' + groups.length + ' 组' : '按父目录自动归类');
  /* 这一页是应用的主用途（常用项目文件夹一键直达），但"增 / 改 / 删"三件事
     原先一个可见入口都没有 —— 全挂在右键上。右键菜单是个没人会猜的交互，
     等于这页只能看不能维护。所以：每行给一个 ⋯（走同一份右键菜单），
     页尾给一个「新增文件夹」。
     空列表也要挂上新增按钮：删完之后没有入口，这一页就永久空了。 */
  const addRow = '<div class="acts-row"><button data-act="folder-new">'
    + IC('plus', 14) + '新增文件夹</button></div>';
  if (!list.length) return html + emptyBox('还没有文件夹入口\n加一个常去的项目目录',
    { act:'folder-new', icon:'plus', label:'登记第一个目录' }) + addRow;
  html += groups.map(g => {
    const cards = g.items.map(f =>
      '<div class="row" data-kind="folder" data-path="' + esc(f.path) + '"'
      + ' style="--i:' + Math.min(k++, 9) + '"' + stg() + '>'
      + '<div class="ic">' + IC('folder', 17) + '</div>'
      + '<div class="tx"><div class="nm">' + esc(f.name) + '</div><div class="hs">' + esc(parentOf(f.path)) + '</div></div>'
      + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 13) + '</button>'
      + '</div>').join('');
    /* 这一组的父目录：加进这一组 = 路径落在它下面。
       分组本来就是按父目录派生的，所以"加进来"这件事只能表达成
       "路径填在这个目录下" —— 预填它，并在保存后如实回报落在哪一组，
       省得用户填完发现跑到了别处还不知道为什么。 */
    const dir = parentOf(g.items[0].path);
    const ctx = { dir:dir, group:g.name };
    return gcard(g.name, g.items.length, cards, { icon:'folder', addKind:'folder', addCtx:ctx });
  }).join('');
  return html + addRow;
}

    const cards = g.items.map(l =>
      '<div class="row" data-kind="link" data-url="' + esc(l.url) + '" data-host="' + esc(l.host) + '"'
      + ' style="--i:' + Math.min(k++, 9) + '"' + stg() + '>'
      + '<div class="ic">' + IC('globe', 17) + '</div>'
      + '<div class="tx"><div class="nm">' + esc(l.name) + '</div><div class="hs">' + esc(l.host) + '</div></div>'
      + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 13) + '</button>'
      + '</div>').join('');
    /* 网址的分组是拿域名匹配正则判出来的，没法预填一个"父目录"。
       能做的是在表单里写清这一组收什么域名 —— 用户填完才知道会落到哪，
       比填完被静默换个组强。 */
    return gcard(g.name, g.items.length, cards, { icon:'globe', addKind:'link', addCtx:{ group:g.name } });
  }).join('');
  return html + addRow;
}

/* ---------- 页 3 · 收藏箱 ---------- */
function buildClip(){
  const p = PAGE_MAP.clip;
  const s = qq(state.query);
  const base = DATA.clip.filter(c => !s || qq(c.title + ' ' + c.desc + ' ' + c.name + ' ' + c.tags.join(' ')).indexOf(s) >= 0);
  const plats = [];
  base.forEach(c => { if (plats.indexOf(c.name) < 0) plats.push(c.name); });
  if (state.clipFilter !== '全部' && plats.indexOf(state.clipFilter) < 0) state.clipFilter = '全部';
  const chips = ['全部'].concat(plats).map(n => {
    const cnt = n === '全部' ? base.length : base.filter(c => c.name === n).length;
    const src = n === '全部' ? null : DATA.clip.find(c => c.name === n);
    const c = src ? ACC[src.slot] : ACC[0];
    return '<button class="chip' + (state.clipFilter === n ? ' on' : '') + '" data-clipfilter="' + esc(n) + '"'
      + ' style="' + vars(c) + '">' + esc(n) + '<span class="n">' + cnt + '</span></button>';
  }).join('');

  const list = visibleClips();
  const total = DATA.clip.length;
  let html = pageHead(p, (state.query || state.clipFilter !== '全部')
      ? '筛选命中 ' + list.length + ' / ' + total + ' 条'
      : '已收藏 ' + total + ' 条 · 按平台自动归类')
    + '<div class="clip-add">' + IC('link', 15)
    + '<input id="clipInput" type="text" placeholder="粘贴公众号 / 小红书 / GitHub 链接，回车即归类" autocomplete="off" spellcheck="false">'
    + '<span class="hint" id="clipHint"></span></div>'
    + '<div class="chips">' + chips + '</div>';

  /* 「新增收藏」这条入口是后补的：收藏箱原来只能靠粘贴链接/复制触发，
     整页一个"手动加"都没有 —— 想补一条早先收藏的文章，没有地方可下手。
     恢复默认那条路（设置页）也确实能填回来，但那是"清空再灌演示数据"，
     不能当新增用。 */
  const addRow = '<div class="acts-row"><button data-act="clip-new">'
    + IC('plus', 14) + '新增收藏</button></div>';
  if (!list.length) return html + emptyBox(state.query ? '没有匹配的收藏'
    : (state.clipFilter === '全部' ? '收藏箱还是空的\n把链接粘到上面那一栏试试' : '这个平台下暂时没有收藏')) + addRow;

  /* 收藏箱条目的信息分层：
       首行 = 平台方块 + 平台名 + 内容类型
       次行 = 标题（2 行截断）
       再次 = 描述（2 行截断）
       底行 = 标签（左） + 时间（右，margin-left:auto）
     两个刻意的处理：
       · 时间不再跟平台名挤在首行 —— 旧版时间在首行右对齐，正好被右上角
         的删除按钮盖住，hover 时两者重叠。
       · 标签超过 3 个折叠成 +N，避免标签换行把卡片撑得高矮不一。
     外层走 gcard(..., {grid:'wide'})：面板 580px 下单列，正文约 400px
     （旧版两列只有约 154px，这是收藏箱"布局不友好"的主因）。 */
  const card = (it, i) => {
    const tags = it.tags || [];
    const shown = tags.slice(0, 3).map(t => '<span class="tg">' + esc(t) + '</span>').join('')
      + (tags.length > 3 ? '<span class="tg more">+' + (tags.length - 3) + '</span>' : '');
    return '<div class="cclip" data-kind="clip" data-url="' + esc(it.url) + '"'
      + ' style="' + vars(ACC[it.slot]) + ';--i:' + Math.min(i, 9) + '"' + stg() + '>'
      + '<div class="hd"><span class="mono">' + esc(it.ab) + '</span>'
      + '<span class="src">' + esc(it.name) + '</span>'
      + '<span class="kind">' + esc(it.kind) + '</span></div>'
      + '<div class="ti">' + esc(it.title) + '</div>'
      + (it.desc ? '<div class="ds">' + esc(it.desc) + '</div>' : '')
      + '<div class="ft"><div class="tgs">' + shown + '</div>'
      + '<span class="tm">' + esc(it.time) + '</span>'
      /* 右上角那个 x 只管删除，改标题 / 备注 / 标签没有入口。
         ⋯ 挂在底行右侧，不跟 x 抢同一个角（旧版时间被删除按钮盖住过）。 */
      + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 12) + '</button></div>'
      + '<button class="x" data-act="clip-del" data-url="' + esc(it.url) + '" title="移除">' + IC('x', 11) + '</button>'
      + '</div>';
  };

  /* 平台筛选态下只有一张卡（就是那个平台），也给它挂上「+」——
     否则筛到某个平台想再补一条，还得先切回"全部"。 */
  if (state.clipFilter !== '全部')
    return html + gcard(state.clipFilter, list.length, list.map(card).join(''),
      { icon:'bookmark', grid:'wide', addKind:'clip', addCtx:{ group:state.clipFilter } }) + addRow;
  let k = 0;
  html += groupBy(list, c => c.name).map(g =>
    gcard(g.name, g.items.length, g.items.map(c => card(c, k++)).join(''),
      { icon:'bookmark', grid:'wide', addKind:'clip', addCtx:{ group:g.name } })).join('');
  return html + addRow;
}

/* ================================================================
   湿空气与热舒适计算 —— ISO 7730 / ASHRAE 55 工程实现
   ----------------------------------------------------------------
   全部是可直接用于工程计算的公式，不是占位。
   ================================================================ */
const PSY = {
  /* 饱和水汽压 kPa —— Magnus 公式，ta 单位 ℃ */
  es: t => 0.6108 * Math.exp(17.27 * t / (t + 237.3)),
  /* 水汽分压 kPa */
  pv: (ta, rh) => PSY.es(ta) * rh / 100,
  /* 含湿量 kg/kg 干空气 */
  d:  (ta, rh, p) => { const e = PSY.pv(ta, rh); return 0.622 * e / ((p || 101.325) - e); },
  /* 露点温度 ℃ */
  td: (ta, rh) => { const e = Math.max(PSY.pv(ta, rh), 1e-6); const v = Math.log(e / 0.6108);
                    return 237.3 * v / (17.27 - v); },
  /* 比焓 kJ/kg 干空气 */
  h:  (ta, rh, p) => { const dd = PSY.d(ta, rh, p); return 1.006 * ta + dd * (2501 + 1.86 * ta); },
  /* 相对湿度 %（由露点反推，用于结露风险判断） */
  rhByTd: (ta, tdv) => Math.min(100, Math.max(0, PSY.es(tdv) / PSY.es(ta) * 100))
};

/* PMV / PPD —— Fanger 模型，ISO 7730 附录 D 的实现
   服装表面温度 tcl 用不动点迭代求解，带 0.5 松弛因子避免振荡。 */
function pmvSolve(ta, tr, vel, rh, met, clo){
  const M   = met * 58.15;      /* met → W/m² */
  const W   = 0;                /* 外部做功，坐姿办公取 0 */
  const Icl = clo * 0.155;      /* clo → m²·K/W */
  const pa  = PSY.pv(ta, rh);   /* kPa */
  const fcl = Icl <= 0.078 ? 1 + 1.29 * Icl : 1.05 + 0.645 * Icl;

  const hcOf = t => Math.max(12.1 * Math.sqrt(Math.max(vel, 0.05)),
                             2.38 * Math.pow(Math.abs(t - ta), 0.25));
  /* tcl 用**二分法**而不是不动点迭代。
     不动点迭代在服装热阻大（≥1.5 clo）时残差斜率 > 1，会在两个值之间来回跳，
     实测 clo=2.0 / ta=-5℃ 时直接发散到 ±Infinity，最后 Inf-Inf 得到 NaN。
     残差 g(t) 关于 t 单调递减，二分法 60 次可精确到 1e-12，且永不发散。 */
  const g = t => {
    const h  = hcOf(t);
    const rd = 3.96e-8 * fcl * (Math.pow(t + 273, 4) - Math.pow(tr + 273, 4));
    return 35.7 - 0.028 * (M - W) - Icl * (rd + fcl * h * (t - ta)) - t;
  };
  let lo = Math.max(ta - 40, -70), hi = 50;
  for (let i = 0; i < 60; i++){ const mid = (lo + hi) / 2; if (g(mid) > 0) lo = mid; else hi = mid; }
  const tcl = (lo + hi) / 2;

  hc = hcOf(tcl);
  const rad    = 3.96e-8 * fcl * (Math.pow(tcl + 273, 4) - Math.pow(tr + 273, 4));
  const conv   = fcl * hc * (tcl - ta);
  /* 注意 pa 的单位：ISO 7730 的 PMV 方程里 pa 取 **Pa**，不是 kPa。
     （皮肤扩散项 3.05e-3·(5733−6.99(M−W)−pa) 与呼吸项 1.7e-5·M·(5867−pa)
      的常数 5733 / 5867 都是按 Pa 标定的。）用 kPa 会多算约 6 W/m² 散热，
     PMV 整体偏冷近 0.4 级。 */
  const paPa = pa * 1000;
  const L = (M - W)
    - 3.05e-3 * (5733 - 6.99 * (M - W) - paPa)
    - 0.42   * ((M - W) - 58.15)
    - 1.7e-5 * M * (5867 - paPa)
    - 0.0014 * M * (34 - ta)
    - rad - conv;
  const pmv = (0.303 * Math.exp(-0.036 * M) + 0.028) * L;
  const ppd = 100 - 95 * Math.exp(-0.03353 * Math.pow(pmv, 4) - 0.2179 * pmv * pmv);
  return { pmv:pmv, ppd:ppd, tcl:tcl, hc:hc, pa:pa, fcl:fcl };
}
/* PMV 七级热感觉标度 */
const pmvWord = v => v < -2.5 ? '冷' : v < -1.5 ? '凉' : v < -0.5 ? '稍凉'
  : v <= 0.5 ? '适中（热中性）' : v <= 1.5 ? '稍暖' : v <= 2.5 ? '暖' : '热';

/* ================================================================

/* ---------- 今日 ---------- */
function buildToday(){
  const p = PAGE_MAP.today;
  const undone = TOOL.todos.filter(t => !t.done).length;
  const done = TOOL.todos.length - undone;
  const curS = TOOL.scenes.find(s => s.id === state.scene);
  let html = pageHead(p, todGreet() + ' · ' + (curS ? '「' + curS.name + '」' : '未选择') + '场景'
    + ' · ' + (undone ? '还有 ' + undone + ' 项待办' : '待办已清空'));

  /* 进度环（R6）：把"已完成"从一格数字升级成一眼可读的形状。
     空清单不画假进度 —— 环中央如实给「—」，不假装 100%。 */
  const pct = TOOL.todos.length ? Math.round(done * 100 / TOOL.todos.length) : -1;
  const CC = 2 * Math.PI * 34;
  html += '<div class="td-hero" style="' + vars(ACC[0]) + '">'
    + '<div class="td-ring"><svg viewBox="0 0 84 84" aria-hidden="true">'
    + '<circle class="td-ring-bg" cx="42" cy="42" r="34"/>'
    + '<circle class="td-ring-fg" cx="42" cy="42" r="34" style="stroke-dasharray:' + CC.toFixed(1)
    + ';stroke-dashoffset:' + (CC * (1 - Math.max(0, Math.min(100, pct)) / 100)).toFixed(1) + '"/>'
    + '</svg><div class="td-ring-t"><div class="td-ring-n">'
    + (pct >= 0 ? pct + '%' : '—') + '</div><div class="td-ring-l">已完成</div></div></div>'
    + '<div class="td-hero-r">'
    + statCell('待办剩余', undone, 'check', ACC[0])
    + statCell('剪切记录', DATA.board.length, 'board', ACC[4])
    + '</div></div>';

  /* 快捷加待办（R6）：想到就记一条，不用开表单 —— 标签/时间走默认
     （待办 · 今天），要精修的仍走下面「新增待办」的完整表单。 */
  html += '<div class="todo-quick"><input id="todoQuick" type="text" autocomplete="off" spellcheck="false"'
    + ' placeholder="写一句要做什么，回车即加（今天 · 待办）">'
    + '<button class="mini" data-act="todo-quick" title="添加这条待办">' + IC('plus', 13) + '</button></div>';

  const todoCards = TOOL.todos.map((t, i) =>
    '<div class="todo' + (t.done ? ' done' : '') + '" data-act="todo-toggle" data-id="' + t.id + '"'
    + ' data-kind="todo" tabindex="0" title="点击勾选 / 取消勾选"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
    + '<span class="td-ck">' + IC('check', 11) + '</span>'
    + '<span class="td-tx">' + esc(t.text) + '</span>'
    + '<span class="td-tag">' + esc(t.tag) + '</span>'
    + '<span class="td-when">' + esc(t.when) + '</span>'
    + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 13) + '</button>'
    + '</div>').join('');
  html += gcard('今日待办', TOOL.todos.length, todoCards, { icon:'check', one:true });
  /* 待办以前只能打勾：不能加、不能改、不能删。这三样缺任何一样，
     这个列表都替不了任何东西 —— 用户迟早会退回记事本。 */
  html += '<div class="acts-row"><button data-act="todo-new">' + IC('plus', 14) + '新增待办</button></div>';

  /* 这一栏原来挂的是 data-kind="file"，和暂存区的文件是同一种 kind ——
     点击处理去 DATA.staging 里找，而最近使用是一条独立的记录，永远找不到，
     于是点了什么都不会发生。给它自己的 kind。
     挂 ⋯ 只为了"移除"一项：这条日志没有可改的东西，但没有删除入口时，
     误记进来的路径只能等被新记录挤掉。 */
  const recCards = TOOL.recent.map((r, i) =>
    '<div class="row" data-kind="recent" data-path="' + esc(r.path) + '" tabindex="0"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
    + '<div class="ic">' + IC(r.kind === 'folder' ? 'folder'
        : (fileKind(r.name) === 'sheet' ? 'sheet' : 'file'), 17) + '</div>'
    + '<div class="tx"><div class="nm">' + esc(r.name) + '</div><div class="hs">' + esc(atText(r.at)) + '</div></div>'
    + '<button class="ctx-more" data-act="ctx-open" title="打开 / 定位 / 移除">' + IC('more', 13) + '</button>'
    + '</div>').join('');
  html += gcard('最近使用', TOOL.recent.length, recCards, { icon:'clock' });

  html += '<div class="td-tip">' + IC('sparkle', 15)
    + '<span>唤出后点侧栏第一项「今日」就能看到待办与最近文件，'
    + '当前场景显示在顶部，切换场景只需一次点击。</span></div>';
  return html;
}
function statCell(label, n, icon, c){
  return '<div class="td-cell" style="' + vars(c) + '"><span class="td-cico">' + IC(icon, 15) + '</span>'
    + '<span class="td-cn">' + n + '</span><span class="td-cl">' + esc(label) + '</span></div>';
}
/* 时段问候（R6）：首页每次唤出都该像"现在"而不是像昨天截的图。 */
function todGreet(){
  const h = new Date().getHours();
  return h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 13 ? '中午好' : h < 18 ? '下午好' : '晚上好';
}
/* 快捷加待办（R6）：一句话 + 回车。默认值写死（待办 · 今天）是有意的 ——
   这条路的价值就是零决策；要标签和时间的还有下面的完整表单。 */
function todoQuickAdd(){
  const inp = $('todoQuick');
  if (!inp) return;
  const v = inp.value.trim();
  if (!v) return toast('先写要做什么');
  TOOL.todos.unshift({ id:'t' + uid(), text:v, done:false, tag:'待办', when:'今天' });
  mark('todos');
  refresh(['today']);
  toast('已加上 · ' + (v.length > 20 ? v.slice(0, 20) + '…' : v));
  /* 重画之后输入框是新的节点，把焦点还回去 —— 连着记三条不打断手 */
  setTimeout(() => { const n = $('todoQuick'); if (n) n.focus(); }, 30);
}

/* ---------- 场景 ---------- */
function buildScene(){
  const p = PAGE_MAP.scene;
  const cur = state.scene;
  const curS = TOOL.scenes.find(s => s.id === cur);
  let html = pageHead(p, '当前场景：' + ((curS || {}).name || '未选择')
    + ' · 一次点击切换整组工作环境');
  /* 这段文案原先是"桌面版会真正执行这些动作：打开目录、唤起应用、执行命令"，
     而实际切场景只弹了一句 toast —— acts 从头到尾没人读过。现在它是真的了，
     所以可以照实写；没做到的那部分（比如命令一定会成功）仍然不承诺。 */
  html += '<div class="dz-hint">' + (DESK
    ? '点卡片会依次执行下面这组动作：目录用资源管理器打开、文件用默认程序打开、'
      + '网址交给浏览器、命令在本机跑。带命令的场景会先问一次。'
      + '点单个动作只跑那一个；动作右边的 ⋯ 可以把它的目标换成你自己的路径，或者删掉它。'
    : '这里演示场景编排：一组目录 / 应用 / 命令打包成一次切换。浏览器里不执行。') + '</div>';

  const addRow = '<div class="acts-row"><button data-act="scene-new">'
    + IC('plus', 14) + '新建场景</button></div>';
  if (!TOOL.scenes.length)
    return html + emptyBox('还没有场景\n建一个，把一组常用目录打包进去') + addRow;

  /* 上一次执行的结果。toast 只来得及说一句话，而"哪个动作没成、为什么"
     应该留在页面上 —— 否则用户只能靠反复点来猜。 */
  if (lastSceneRun && lastSceneRun.id === cur){
    html += '<div class="sc-res' + (lastSceneRun.bad ? ' bad' : '') + '">'
      + '<span class="sc-res-h">' + IC(lastSceneRun.bad ? 'x' : 'check', 12)

      + (lastSceneRun.bad ? ' · ' + lastSceneRun.bad + ' 个没成' : '') + '</span>'
      + (lastSceneRun.detail.length
          ? '<div class="sc-res-l">' + lastSceneRun.detail.map(d =>
              '<div class="sc-res-i"><span class="sc-res-t">' + esc(d.t) + '</span>'
              + '<span class="sc-res-e">' + esc(d.err) + '</span></div>').join('') + '</div>'
          : '')
      + '</div>';
  }

  const cards = TOOL.scenes.map((s, i) => {
    const on = s.id === cur;
    const miss = s.acts.filter(a => sceneMiss(a)).length;
    const acts = s.acts.map((a, j) => {
      const m = ACT_META[a.k] || ACT_META.folder;
      const bad = sceneMiss(a);
      /* 动作条上那个「⋯」是补上的：在此之前，场景里单个动作**只能靠右键**
         改（换成我选的目录 / 改网址 / 改命令 / 改显示名 / 删掉这个动作）。
         "只有右键 = 没有入口"这条规矩在卡片、列表上都立过，动作条当时漏了
         —— 于是加进去的动作改不动，看起来就像个死物。它必须是常态可见的，
         所以不进 hover、不设透明度。 */
      /* 动作条自己也能点：点一下就只跑**这一个**动作。
         在此之前点动作条会冒泡到卡片上的 scene-go，把整组动作全跑一遍 ——
         一个写着「打开 Thermal 目录」的小标签点下去却开了四个目录，
         这不是用户能猜到的事。整组执行留给卡片本身（点头部/空白处）。 */
      return '<div class="sc-act' + (bad ? ' miss' : '') + '" data-act="scene-one"'
        + ' data-kind="sceneAct"'
        + ' data-sid="' + s.id + '" data-ai="' + j + '"'
        + ' title="' + (bad
            ? '本机找不到这个目标 · 右边的 ⋯ 可以换成你自己的路径'

        + '<span class="sc-ai">' + IC(m.ic, 12) + '</span>'
        + '<span class="sc-at">' + esc(a.t) + '</span>'
        + (bad ? '<span class="sc-aw">找不到</span>' : '')
        + '<button class="ctx-more" data-act="ctx-open" title="改这个动作 / 删掉它">'
        + IC('more', 12) + '</button>'
        + '</div>';
    }).join('');
    return '<div class="scard' + (on ? ' on' : '') + '" data-act="scene-go" data-id="' + s.id + '"'
      + ' data-kind="sceneCard"'
      + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
      + '<div class="scard-h"><span class="scard-nm">' + esc(s.name) + '</span>'
      + (on ? '<span class="scard-on">' + IC('check', 11) + '当前</span>'
            : '<span class="scard-n">' + s.acts.length + ' 个动作</span>')
      + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除这个场景">' + IC('more', 13) + '</button>'
      + '</div>'
      + (s.desc ? '<div class="scard-d">' + esc(s.desc) + '</div>' : '')
      + '<div class="scard-a">' + (acts || '<div class="sc-empty">还没有动作 · 用卡片右上角的 ⋯ 加一个</div>') + '</div>'
      + (DESK && miss
          ? '<div class="scard-w">' + IC('x', 11) + miss + ' 个目标在本机找不到 · 点动作右边的 ⋯ 换掉，或整个删掉</div>'
          : '')
      + '</div>';
  }).join('');
  html += gcard('工作场景', TOOL.scenes.length, cards, { icon:'route', one:true });

  html += addRow;

  html += '<div class="td-tip">' + IC('route', 15)
    + '<span>场景的本质是「跨应用编排」——桌面快捷方式只能开一个目标，'
    + '而一次标定要同时就位目录、工程、工具与在线表格。</span></div>';

  /* 探测放到最后：卡片先渲染出来，结果回来再补标记。
     先查再画的话，每次进这一页都要空等一次文件系统。 */
  probeScenes();
  return html;
}

function buildSnip(){

  if (!list.length) return html + emptyBox(all ? '没有匹配的片段'
    : '还没有收藏的片段\n点片段标题旁的 ★ 收起来，它们会聚在这一栏') + addRow;

  const card = (s, i) =>
    '<div class="snip" data-act="snip-copy" data-id="' + s.id + '" data-kind="snip" tabindex="0"'
    + ' title="点击复制（带 {{变量}} 的会先让你填）"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
    + '<div class="snip-h"><span class="snip-lang">' + esc(s.lang) + '</span>'
    + '<span class="snip-nm">' + esc(s.name) + '</span>'
    + (s.vars.length ? '<span class="snip-v">' + s.vars.length + ' 变量</span>' : '')
    + '<button class="snip-fav' + (s.fav ? ' on' : '') + '" data-act="snip-fav" data-id="' + s.id
    + '" title="' + (s.fav ? '取消收藏' : '收藏（会聚到 ★ 栏）') + '">' + IC('star', 13) + '</button>'
    + '<span class="snip-cp">' + IC('copy', 13) + '</span>'
    + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 13) + '</button>'
    + '</div><pre class="snip-code">' + esc(s.text) + '</pre></div>';

  /* 分组按数据里实际出现的跑，不再用一张写死的表。
     片段以前是只读的，写死三种分组没问题；一旦能编辑，用户就会自己起
     分组名（"热管理公式""台架脚本"），而写死的遍历会让新分组下的片段
     整条从页面上消失 —— 存着、搜得到，就是看不见。 */
  const groups = [];
  list.forEach(s => { if (groups.indexOf(s.g) < 0) groups.push(s.g); });
  let k = 0;
  groups.forEach(g => {
    const items = list.filter(s => s.g === g);
    if (!items.length) return;
    html += gcard(g, items.length, items.map(s => card(s, k++)).join(''),
      { icon: g === '终端命令' ? 'terminal' : g === '文本模板' ? 'note' : 'code',
        one:true,
        /* 分组名直接预填进表单 —— 片段的分组是数据里的一个字段，
           不像文件夹那样是派生的，所以这是真正意义上的"加进这一组"。 */
        addKind:'snip', addCtx:{ group:g } });
  });
  return html + addRow;
}

    + '</select></div>'

    + numField('psy-rh', '相对湿度', state.psy.rh, '%', 1)
    + '</div>'
    + '<div class="psy-out" id="psyOut"></div></div>';

  html += '<div class="pmv" style="' + vars(ACC[0]) + '">'

    + '<span class="conv-note">ISO 7730 · Fanger</span></div>'
    + '<div class="pmv-in">'
    + numField('pmv-ta',  '空气温度 ta',  state.pmvIn.ta,  '℃',    0.1)
    + numField('pmv-tr',  '平均辐射 tr',  state.pmvIn.tr,  '℃',    0.1)
    + numField('pmv-vel', '风速 vel',     state.pmvIn.vel, 'm/s',  0.01)
    + numField('pmv-rh',  '相对湿度',     state.pmvIn.rh,  '%',    1)
    + numField('pmv-met', '代谢率 met',   state.pmvIn.met, 'met',  0.05)
    + numField('pmv-clo', '服装热阻',     state.pmvIn.clo, 'clo',  0.05)

function numField(id, label, val, unit, step){
  return '<label class="nf"><span class="nf-l">' + esc(label) + '</span>'
    + '<span class="nf-b"><input type="number" id="' + id + '" value="' + val + '" step="' + step + '">'
    + '<span class="nf-u">' + esc(unit) + '</span></span></label>';
}
/* 换算 / 湿空气 / PMV 的结果渲染 —— 输入变了只改这三块，不整页重建 */
function calcUpdate(){
  const g   = convGroup(state.convGroup);
  const raw = parseFloat((document.querySelector('[data-conv="val"]') || {}).value);
  const v   = isFinite(raw) ? raw : 0;
  const out = $('convOut');
  if (out && g.u[state.convFrom]){
    const base = g.u[state.convFrom].to(v);
    out.innerHTML = Object.keys(g.u).filter(u => u !== state.convFrom).map(u => {
      const r = g.u[u].from(base);
      /* R7：整行可点 = 复制"值 + 单位"（贴进表格/邮件才不用手动补单位）；
         行尾 ⇄ = 把这个单位和值换回输入框（倒着算），数值走全精度
         dataset 而不是显示值 —— 显示值经 fmtNum 截位，倒算会攒误差。 */
      return '<div class="cvo" data-act="conv-copy" data-v="' + String(r) + '" data-u="' + esc(u)
        + '" title="点击复制，行尾 ⇄ 换成转换源">'
        + '<span class="cvo-v">' + fmtNum(r) + '</span><span class="cvo-u">' + esc(u) + '</span>'
        + '<button class="ctx-more cvo-sw" data-act="conv-use" data-v="' + String(r) + '" data-u="' + esc(u)
        + '" title="把这个单位换到输入框">' + IC('swap', 11) + '</button></div>';
    }).join('');
  }

  const taEl = $('psy-ta'), rhEl = $('psy-rh'), pOut = $('psyOut');
  if (taEl && rhEl && pOut){
    const ta = parseFloat(taEl.value), rh = Math.min(100, Math.max(1, parseFloat(rhEl.value)));
    if (isFinite(ta) && isFinite(rh)){
      state.psy.ta = ta; state.psy.rh = rh;
      const td  = PSY.td(ta, rh), dd = PSY.d(ta, rh) * 1000, hh = PSY.h(ta, rh), pv = PSY.pv(ta, rh);
      const fog = ta <= td + 0.5;
      pOut.innerHTML = resCell('露点温度', td.toFixed(1) + ' ℃', fog ? '结露风险' : '安全', fog)
        + resCell('含湿量', dd.toFixed(2) + ' g/kg', '干空气', false)
        + resCell('比焓', hh.toFixed(1) + ' kJ/kg', '干空气', false)
        + resCell('水汽分压', pv.toFixed(3) + ' kPa', '饱和 ' + PSY.es(ta).toFixed(3), false);
    }
  }

  const ids = ['pmv-ta','pmv-tr','pmv-vel','pmv-rh','pmv-met','pmv-clo'];
  const els = ids.map(i => $(i)), mo = $('pmvOut');
  if (els.every(Boolean) && mo){
    const ta = parseFloat(els[0].value), tr = parseFloat(els[1].value), vel = parseFloat(els[2].value);
    const rh = parseFloat(els[3].value), met = parseFloat(els[4].value), clo = parseFloat(els[5].value);
    if ([ta,tr,vel,rh,met,clo].every(isFinite)){
      state.pmvIn = { ta:ta, tr:tr, vel:vel, rh:rh, met:met, clo:clo };
      const r = pmvSolve(ta, tr, vel, rh, met, clo);
      const ok = Math.abs(r.pmv) <= 0.5;
      mo.innerHTML = '<div class="pmv-big' + (ok ? ' ok' : '') + '">'
        + '<div class="pmv-n">' + r.pmv.toFixed(2) + '</div>'
        + '<div class="pmv-l">PMV · ' + esc(pmvWord(r.pmv)) + '</div></div>'
        + resCell('PPD', r.ppd.toFixed(1) + ' %', r.ppd <= 10 ? '达标' : '超标', r.ppd > 10)
        + resCell('服装表面温度 tcl', r.tcl.toFixed(1) + ' ℃', '', false)
        + resCell('对流换热系数 hc', r.hc.toFixed(2) + ' W/(m²·K)', '', false)
        + resCell('服装面积系数 fcl', r.fcl.toFixed(3), '', false)
        + resCell('水汽分压 pa', r.pa.toFixed(3) + ' kPa', '', false);
    }
  }
}
function resCell(label, val, note, warn){
  return '<div class="rc' + (warn ? ' warn' : '') + '"><span class="rc-l">' + esc(label) + '</span>'
    + '<span class="rc-v">' + esc(val) + '</span>'
    + (note ? '<span class="rc-n">' + esc(note) + '</span>' : '') + '</div>';
}
const fmtNum = v => {
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a !== 0 && (a < 0.01 || a >= 1e6)) return v.toExponential(3);
  return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(Math.min(4, Math.max(2, 6 - String(Math.floor(a)).length)));
};

function buildNote(){
  const p = PAGE_MAP.note;

    + '<div class="note-add"><textarea id="noteInput" rows="2" placeholder="记点什么…… Ctrl + Enter 保存"></textarea>'

  if (!TOOL.notes.length) return html + emptyBox('还没有速记\n在上方写点什么试试');

  /* 标签筛选（R8）：标签从数据里现长出来（写死名单会跟用户自起的标签

  const tags = [];

  if (!shown.length) return html + emptyBox('「' + state.noteTag + '」标签下还没有速记\n换个标签，或记一条带这个标签的');

  const card = (n, i) =>
    '<div class="ncard" data-kind="note" data-id="' + n.id + '" tabindex="0" title="点击编辑这条速记"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'

    + '<div class="ncard-f"><span class="ncard-tag">' + esc(n.tag) + '</span>'
    + '<span class="ncard-at">' + esc(n.at) + '</span>'
    + '<button class="ncard-cp" data-act="note-copy" data-id="' + n.id + '" title="复制">' + IC('copy', 12) + '</button>'
    /* 原来这里是直接的"删除 ×"。删改成菜单入口：速记最需要的其实是
       "改一个字"，而删除本来就不该是一个没有确认的一步操作。 */
    + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 12) + '</button></div></div>';
  let k = 0;
  ['今天','昨天','更早'].forEach(d => {
    const items = shown.filter(n => n.day === d);
    if (!items.length) return;
    html += gcard(d, items.length, items.map(n => card(n, k++)).join(''),
      { icon: d === '今天' ? 'note' : d === '昨天' ? 'clock' : 'layers', one:true });
  });
  return html;
}

/* 速问页。四个层次，从「能不能用」到「用了什么」：
     1) 状态条：服务商 / 模型 / Key 三样各是什么、缺哪一样，直接给「去设置」。
     2) 会话条：这一段对话叫什么、第几轮、快还是深、要不要读知识库 ——
        三个开关都记在**会话**上，不是全局设置（这一问要不要看我的资料
        是每一段对话各自的事）。
     3) 会话列表 + 本轮对话：会话是真实集合，能改名、能删、能搜；
        同一段里的问答按时间正序排，跟人读对话的方向一致。
     4) 常用问法与知识库：问法可增删改；知识库列源、报块数、能增量重扫。

   浏览器原型里知识库那张卡只写清「做不到、为什么」，**不放按钮** ——
   它需要在用户机器上读文件、切块、调嵌入模型，浏览器里没有这一层。 */
function buildAsk(){
  const p = PAGE_MAP.ask;
  const ready = aiReady();
  const sess = askSessCur();
  const turns = sess ? askTurns(sess.id) : [];
  let html = pageHead(p, TOOL.askSess.length
    ? '共 ' + TOOL.askSess.length + ' 段会话 · ' + TOOL.asks.length + ' 条问答'

  html += aiStatusStrip();
  html += askSessBar(sess, turns.length);

  html += '<div class="ask-bar"><textarea id="askInput" rows="2" placeholder="'
    + (ready.ok ? '问点什么…… 当前模型 ' + esc(state.settings.ai.model)
               : '问点什么…… 先在设置页配好模型（上面的状态条里有入口）')
    + '　Ctrl + Enter 发送"></textarea>'
    + '<button class="ask-go' + (ready.ok ? '' : ' off') + '" data-act="ask-send" title="发送">'
    + IC('sparkle', 15) + '</button></div>';

  /* ---- 会话列表。当前那段用 on 标出来；每一行都带可见 ⋯（切 / 改名 / 删）。
     「新会话」既是上面那条里的按钮，也在这一组的 + 上（同一条路）。 ---- */
  const sessRows = TOOL.askSess.map((s, i) => {
    const n = askTurns(s.id).length;
    return '<div class="sess-row' + (sess && s.id === sess.id ? ' on' : '') + '"'
      + ' data-kind="askSess" data-id="' + esc(s.id) + '" style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
      + '<button class="sess-b" data-act="ask-sess-use" data-id="' + esc(s.id) + '">'
      + '<span class="sess-t">' + esc(s.title || '未命名会话') + '</span>'
      + '<span class="sess-s">' + esc(s.at || '') + ' · ' + (n ? n + ' 轮' : '还没问过')
      + ' · ' + (s.mode === 'deep' ? '深' : '快')
      + (s.kb ? ' · 知识库' : '') + (s.only ? ' · 仅资料' : '') + '</span></button>'
      + '<button class="ctx-more" data-act="ctx-open" title="切到 / 重命名 / 删除">' + IC('more', 12) + '</button>'
      + '</div>';
  }).join('');
  html += gcard('会话', TOOL.askSess.length,
    sessRows || emptyBox('还没有会话\n问一句就会自动开一段；也可以点这一组的 + 先起一段'),
    { icon:'bot', hideN:true, addKind:'askSess' });

  /* ---- 本轮对话。这一块就是「多轮」看得见的地方：同一段会话里的问答按先后
     排下来，发下一句时会带着这几轮当上下文（最近 6 轮）。 ---- */
  const cards = turns.map((a, i) => askCard(a, i)).join('');
  html += gcard(sess ? ('本轮对话 · ' + (sess.title || '未命名会话')) : '本轮对话', turns.length,
    cards || emptyBox(ready.ok
      ? '这一段还没问过\n在上面输入框里问一句，它就会出现在这里'
      : '这一段还没问过\n先到设置页配好模型（状态条上有入口）'),
    { icon:'text', one:true, addKind:'ask', addCtx:{ sess:(sess ? sess.id : '') } });

  html += askTplCard();
  html += kbCard();

  const demoN = TOOL.asks.filter(a => a.state === 'demo').length;
  html += '<div class="acts-row">'
    + '<button data-act="ask-new">' + IC('plus', 14) + '手工记一条问答</button>'
    + (demoN ? '<button data-act="ask-clear-demo">' + IC('x', 14) + '清掉 ' + demoN + ' 条演示问答</button>' : '')
    + '<button data-act="ask-clear">' + IC('trash', 14) + '清空问答记录</button>'
    + '</div>';
  return html;
}
/* 会话条：这一段叫什么 + 三个开关。档位用两个按钮而不是 data-seg ——
   data-seg 会把值写进 state.settings（见 setSetting），而这三个开关都属于
   会话、不属于全局设置，混进去会让「切了会话，别的对话行为也变了」。 */
function askSessBar(sess, n){
  const mode = sess ? (sess.mode === 'deep' ? 'deep' : 'fast') : 'fast';
  return '<div class="asess">'
    + '<div class="asess-h">'
    + '<span class="asess-t">' + esc(sess ? (sess.title || '未命名会话') : '还没有会话') + '</span>'
    + '<span class="asess-n">' + (n ? '下一轮是第 ' + (n + 1) + ' 轮' : '还没开始') + '</span>'
    + (sess ? '<button class="ctx-more" data-act="ctx-open" data-kind="askSess" data-id="' + esc(sess.id) + '"'
        + ' title="切到 / 重命名 / 删除">' + IC('more', 12) + '</button>' : '')
    + '</div>'
    + '<div class="asess-r">'
    + '<button class="asess-tg' + (mode === 'fast' ? ' on' : '') + '" data-act="ask-mode"'
    + ' data-mode="fast" title="快：按设置里填的上限直接答">' + IC('play', 13) + '快</button>'
    + '<button class="asess-tg' + (mode === 'deep' ? ' on' : '') + '" data-act="ask-mode"'
    + ' data-mode="deep" title="深：开思考，输出上限自动放宽">' + IC('layers', 13) + '深</button>'
    + '<button class="asess-tg' + (sess && sess.kb ? ' on' : '') + '" data-act="ask-kb">'
    + IC('book', 13) + '知识库</button>'
    + '<button class="asess-tg' + (sess && sess.only ? ' on' : '') + '" data-act="ask-only">'
    + IC('lock', 13) + '只依据知识库</button>'
    + '<button class="asess-tg" data-act="ask-sess-new">' + IC('plus', 13) + '新会话</button>'
    + '</div>'
    + '<div class="asess-hint">' + askSessHint(sess) + '</div>'
    + '</div>';
}
/* 这一段现在是怎么设置的，用人话写出来。★ 那句是重点：开了知识库却用不了时，
   必须当场说，而不是等用户点了提问、拿到一个「没检索到」再自己猜。 */
function askSessHint(sess){
  if (!sess) return '还没有会话 —— 问一句就会自动开一段。';
  const bits = [];
  bits.push(sess.mode === 'deep'
    ? '「<b>深</b>」：会开思考、输出上限自动放宽到 3000（DeepSeek 推理型 8000），慢一些但更完整'
    : '「<b>快</b>」：按设置里填的回答长度上限直接答（默认 900）');
  if (!sess.kb) bits.push('知识库关着：它只用模型自己的知识答');
  else if (sess.only) bits.push('知识库开着且锁死：资料里没有的它会直接说不确定，不拿自己的知识补');
  else bits.push('知识库开着：每次提问先在你的资料里检索，回答里会用（片段N）标出依据');
  bits.push('多轮：最近 6 轮会作为上下文一起发出去');
  const un = sess.kb ? kbUnavailable() : '';
  if (un) bits.push('<b>★ 但知识库现在用不了：</b>' + esc(un));
  return bits.join('；');
}
/* 一条问答。档位、引用都挂在它自己身上 —— 这样才能「这一条当时是怎么问的」
   一目了然，而不是全页共用一套显示状态。 */
function askCard(a, i){
  const refs = (a.refs || []).length
    ? '<div class="qa-refs">' + a.refs.map(r =>
        '<span class="qa-ref" title="' + esc(r.source || '') + '"><i>片段' + r.n + '</i>'
        + '<span>' + esc(r.title || r.source || '未命名来源') + '</span></span>').join('') + '</div>'
    : '';
  return '<div class="qa" data-kind="ask" data-id="' + esc(a.id) + '"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
    + '<div class="qa-q"><span class="qa-av">' + IC('bot', 14) + '</span><span>' + esc(a.q) + '</span>'
    + (a.state === 'demo' ? '<span class="qa-demo">演示</span>' : '')
    + (a.mode === 'deep' ? '<span class="qa-chip">深</span>' : '')
    + '<button class="ctx-more" data-act="ctx-open" title="重新问 / 编辑 / 删除">' + IC('more', 12) + '</button>'
    + '</div>'
    + '<div class="qa-a' + (a.state === 'run' ? ' run' : a.state === 'err' ? ' err' : '') + '">'
    + esc(a.a) + '</div>'
    + refs
    + '<div class="qa-f"><button data-act="ask-to-note" data-id="' + esc(a.id) + '">' + IC('note', 13) + '存入速记</button>'
    + '<button data-act="ask-copy" data-id="' + esc(a.id) + '">' + IC('copy', 13) + '复制回答</button>'
    + (a.state === 'err' ? '<button data-act="ask-retry" data-id="' + esc(a.id) + '">' + IC('swap', 13) + '重试</button>' : '')
    + '<span class="qa-m">' + esc(a.at || '') + (a.model ? ' · ' + esc(a.model) : '') + '</span>'
    + '</div></div>';
}
function askTplCard(){
  const tpl = TOOL.askTpl.map((t, i) =>
    '<div class="ask-tpl" data-kind="askTpl" data-id="' + esc(t.id) + '"'
    + ' style="--i:' + Math.min(i, 9) + '"' + stg() + '>'
    + '<button class="ask-tpl-b" data-act="ask-tpl" data-id="' + esc(t.id) + '">'
    + IC(t.ic, 14) + '<span>' + esc(t.t) + '</span></button>'
    + '<button class="ctx-more" data-act="ctx-open" title="编辑 / 删除">' + IC('more', 12) + '</button>'
    + '</div>').join('');
  return gcard('常用问法', TOOL.askTpl.length, tpl || emptyBox('还没有常用问法'),
    { icon:'sparkle', hideN:true, addKind:'askTpl' });
}
/* 知识库那一栏。浏览器原型里**不摆按钮**：它需要在用户机器上读文件、
   切块、调嵌入模型 —— 摆一排点不动的按钮，比缺功能更让人困惑。 */
function kbCard(){
  if (!DESK || !JZ || !JZ.kb)
    return gcard('知识库', 0,
      '<div class="kb-note">' + IC('book', 15) + '<div><b>知识库要桌面版</b>'
      + '<span>它要在你这台机器上读文件、按语义切块、调用嵌入模型，再把向量存到本机。'
      + '浏览器原型里没有这一层，所以这里不放按钮 —— 摆了也点不动。</span></div></div>',
      { icon:'book', hideN:true });

  const un = kbUnavailable();
  const st = kbState.stats;
  const rows = (kbState.sources || []).map(s =>
    '<div class="kb-src">'
    + '<span class="kb-ic">' + IC(kbKindIcon(s.kind), 13) + '</span>'
    + '<div class="kb-m"><b>' + esc(s.label || s.target) + '</b>'
    + '<span>' + esc(kbKindName(s.kind)) + ' · ' + esc(s.target) + '</span></div>'
    + '<span class="kb-n">' + (s.chunks || 0) + ' 块</span>'
    + '<button class="mini" data-act="kb-del" data-id="' + esc(s.id) + '">移除</button>'
    + '</div>').join('');

  let body = '';
  if (kbState.error)
    body += '<div class="kb-note bad">' + IC('book', 15) + '<div><b>读取知识库状态失败了</b><span>'
      + esc(kbState.error) + '</span></div></div>';
  if (un)
    body += '<div class="kb-note">' + IC('book', 15) + '<div><b>还不能用</b><span>' + esc(un)
      + '</span></div></div>';
  body += rows || emptyBox(kbState.loading
    ? '正在读取知识库…'
    : '还没有接入任何资料\n可以加一个文件夹、几个文件、一个网页，或直接贴一段文字');
  body += '<div class="kb-acts">'
    + '<button class="mini" data-act="kb-add-folder">' + IC('folder', 13) + '加文件夹</button>'
    + '<button class="mini" data-act="kb-add-files">' + IC('file', 13) + '加文件</button>'
    + '<button class="mini" data-act="kb-add-url">' + IC('globe', 13) + '加网页</button>'
    + '<button class="mini" data-act="kb-add-text">' + IC('note', 13) + '贴一段文字</button>'
    + '<button class="mini" data-act="kb-reindex">' + IC('swap', 13) + '重新扫描</button>'
    + ((kbState.sources || []).length
        ? '<button class="mini" data-act="kb-clear">' + IC('trash', 13) + '清空知识库</button>' : '')
    + '</div>'
    + '<div class="kb-note">' + IC('book', 15) + '<div><b>'
    + (st ? (st.sources + ' 个来源 · ' + st.chunks + ' 块 · ' + (st.dim || 0) + ' 维向量')
          : '还没有向量数据')
    + '</b><span>支持 .md / .txt / 代码 / .pdf / .docx 与网页。'
    + '网页抓取是最朴素的那种（不跑 JavaScript），靠脚本渲染正文的页面会抓不到，那时会如实报错。'
    + '「重新扫描」只重嵌新增和改动过的文件，不会整库重建。</span></div></div>';
  return gcard('知识库', (kbState.sources || []).length, body, { icon:'book', hideN:true });
}

/* ================================================================
   四·补二、真终端（ConPTY）
   ----------------------------------------------------------------
   这一块从 suzike/agentic-island（同为 Electron + node-pty）搬过来，
   但只搬"能在这里成立的"：

   保留：
     · 多标签的真 ConPTY 会话（vim / top / 交互式 CLI 都能跑）
     · 16 条命令预设，按 项目 / Git / Node / 系统 分组
     · 危险命令识别 —— 目的不是拦截，是让你在回车之前看见一次
     · 输出摘要（连续重复行折叠）—— 构建日志刷几百行是常态，
       不折的话"交给 AI 分析"这一步会先把上下文烧光
     · 退出码（靠 PowerShell prompt 包装发 OSC 633;D）与当前目录
     · 把终端现场交给 AI 做诊断 / 生成交接摘要

   不搬（并说明理由，免得看起来像漏了）：
     · 工作区快照的独立文件格式 —— 聚珍的标签元数据直接进存档
       （store.json），再开一套"导入导出"只会让备份有两个入口
     · 独立窗口 / 分屏 —— 用户的决定是"进终端页自动钉住"，不是开新窗口

   一条硬约束：浏览器原型里没有 PTY。那里**不**加载 xterm，页面如实写
   "终端需要桌面版"，而不是给一个点了没反应的输入框。
   ================================================================ */

/* ---------- 命令预设 ---------- */
const TERM_PRESETS = [
  { g:'项目', label:'当前位置', cmd:'Get-Location', desc:'当前工作目录' },
  { g:'项目', label:'目录详情', cmd:'Get-ChildItem -Force', desc:'含隐藏项' },

  { g:'项目', label:'工具版本', cmd:'Get-Command git,node,npm,python -ErrorAction SilentlyContinue | Select-Object Name,Version,Source', desc:'开发工具在哪' },
  { g:'Git',  label:'仓库状态', cmd:'git status --short --branch', desc:'分支与未提交' },
  { g:'Git',  label:'变更统计', cmd:'git diff --stat', desc:'改动规模' },
  { g:'Git',  label:'最近提交', cmd:'git log --oneline --decorate -8', desc:'最近八条' },
  { g:'Git',  label:'分支概览', cmd:'git branch --all --verbose --no-abbrev', desc:'本地与远端' },
  { g:'Node', label:'可用脚本', cmd:'npm run', desc:'package.json scripts' },
  { g:'Node', label:'运行测试', cmd:'npm test', desc:'跑项目测试' },
